# Пример для Render. На бесплатном тарифе файловая система временная: аккаунты и личные тесты
# могут пропасть при перезапуске. Тесты из builtin-tests.json встроены в деплой и сохраняются.
# Для постоянного хранения аккаунтов и личных тестов нужен тариф с диском/БД — см. INSTRUKCIYA.md.
services:
  - type: web
    name: kviz-arena
    runtime: node
    plan: free
    startCommand: node server.js
