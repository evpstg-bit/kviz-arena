# Пример для Render. ВНИМАНИЕ: на бесплатном тарифе файловая система временная —
# аккаунты и тесты пропадут при перезапуске. Для постоянного хранения нужен тариф с диском
# (тогда задайте DATA_DIR на путь диска) или свой сервер — см. INSTRUKCIYA.md.
services:
  - type: web
    name: kviz-arena
    runtime: node
    plan: free
    startCommand: node server.js
