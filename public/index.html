function applyTheme(theme,persist=true){
 const dark=theme==='dark';
 document.documentElement.classList.toggle('dark',dark);
 document.documentElement.dataset.theme=dark?'dark':'light';
 try{if(persist)localStorage.setItem('kviz-theme',dark?'dark':'light')}catch(e){}
 const btn=$('theme-toggle');if(btn){btn.textContent=dark?'☀ Светлая тема':'🌙 Тёмная тема';btn.title=dark?'Переключить на светлую тему':'Переключить на тёмную тему';btn.setAttribute('aria-label',btn.title)}
 const meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.content=dark?'#0b1020':'#7c3aed';
}

 ${K?'':`<label class="mut">Секунд на вопрос по умолчанию: <input type="number" value="${quiz.T}" min="5" max="240" style="width:80px" oninput="quiz.T=Math.max(5,+this.value||20)"></label>`}</div>
 <div class="card qe"><b>🎮 Режим игры</b>
 <label><input type="radio" name="mode" ${K?'':'checked'} onchange="quiz.mode='classic';editor()"><span><b>Classic</b> — вопросы идут по очереди для всех, очки за правильность и скорость</span></label>
 <label><input type="radio" name="mode" ${K?'checked':''} onchange="quiz.mode='kingdoms';editor()"><span><b>Color Kingdoms</b> — две команды сражаются за территорию. Каждый отвечает в своём темпе; за серию верных ответов игрок ставит флаг на карту. Окружите ладью соперника — и трофей ваш</span></label>
 ${K?`<div class="mt-3 grid gap-3 sm:grid-cols-2"><label class="mut">Длительность игры, минут (1–10)<input type="number" min="1" max="10" value="${quiz.dur}" oninput="quiz.dur=Math.min(10,Math.max(1,Math.round(+this.value)||5))"></label>
 <label class="mut">Верных ответов на один флаг<select onchange="quiz.need=+this.value">${[1,2,3,4,5].map(n=>`<option ${quiz.need===n?'selected':''}>${n}</option>`).join('')}</select></label></div>
 <p class="mut text-sm">Игроки делятся на две команды случайно. Вопросы повторяются по кругу, если игрок ответил на все до конца времени.</p>`:''}</div>
 <div class="card"><b>📥 Импорт из Excel (.xlsx)</b><p class="mut" style="margin:6px 0">Загрузите .xlsx — текущие вопросы будут заменены. Если в «правильных ответах» несколько номеров (например, 1,3), студентам нужно отметить их все.</p>
 <div class="row"><input type="file" id="xf" accept=".xlsx,.xls" onchange="importX(this)"><button class="sec" onclick="tpl()">Скачать шаблон</button></div></div>`+

 <input type="text" value="${esc(q.t)}" oninput="quiz.q[${i}].t=this.value" placeholder="Текст вопроса">`+
 q.a.map((x,j)=>`<label><input type="checkbox" ${q.cs.includes(j)?'checked':''} onchange="tg(${i},${j},this.checked)"><span style="color:var(--c${j})">${SH[j]}</span><input type="text" value="${esc(x)}" oninput="quiz.q[${i}].a[${j}]=this.value" placeholder="Вариант ${j+1}"></label>`).join('')+
 `<p class="mut" style="margin:4px 0">Отметьте галочкой правильный ответ. Если отметить несколько — студенты должны выбрать их все.</p>${K?'':`<label class="mut">Секунд: <input type="number" min="5" max="240" value="${q.T||''}" placeholder="${quiz.T}" style="width:90px" oninput="quiz.q[${i}].T=+this.value||undefined"></label>`}</div>`).join('')+

}
function parseRows(rows){
 const cls=v=>{v=String(v??'').trim();if(/correct|правильн/i.test(v))return'c';if(/time|врем|лимит/i.test(v))return't';
  const m=v.match(/(?:answer|ответ)\s*([1-4])/i);if(m)return'a'+(m[1]-1);if(/question|вопрос/i.test(v))return'q';return''};
 const h=rows.findIndex(r=>{const k=r.map(cls);return k.includes('q')&&k.includes('a0')});
 if(h<0)return{q:[],errors:['Не найдена строка заголовков (Question, Answer 1 …)']};
 const col={};rows[h].forEach((v,i)=>{const k=cls(v);if(k&&!(k in col))col[k]=i});
 const q=[],errors=[];
 for(let r=h+1;r<rows.length;r++){
  const row=rows[r],t=String(row[col.q]??'').trim();if(!t)continue;
  const a=[0,1,2,3].map(j=>col['a'+j]===undefined?'':String(row[col['a'+j]]??'').trim());
  while(a.length&&!a[a.length-1])a.pop();
  const cs=[...new Set(String(row[col.c]??'').split(/[^0-9]+/).filter(Boolean).map(n=>+n-1))].filter(n=>n>=0&&n<a.length).sort((x,y)=>x-y);
  if(a.length<2||a.some(x=>!x)){errors.push('Строка '+(r+1)+': нужно минимум 2 варианта без пропусков');continue}
  if(!cs.length){errors.push('Строка '+(r+1)+': не указан правильный ответ');continue}
  const T=+row[col.t];q.push({t,a,cs,T:T>0?Math.min(240,Math.max(5,T)):undefined});
 }
 return{q,errors};
}
async function importX(inp){
 const f=inp.files[0];if(!f)return;msg='';info='';
 if(typeof XLSX==='undefined'){msg='Библиотека чтения Excel не загрузилась';return editor()}
 try{
  const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
  const r=parseRows(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''}));
  if(r.q.length){quiz.q=r.q.slice(0,100);quiz.title=f.name.replace(/\.[^.]+$/,'');info='Загружено вопросов: '+quiz.q.length}
  if(r.errors.length)msg=r.errors.slice(0,5).join('; ');else if(!r.q.length)msg='В файле нет вопросов';
 }catch(e){msg='Не удалось прочитать файл'}
 editor();
}

const getSess=()=>{try{return JSON.parse(sessionStorage.getItem('qs'))}catch(e){return null}};
function clearSess(){try{sessionStorage.removeItem('qs')}catch(e){}}
function connect(){
 if(es)es.close();fbSeen=-2;bnSeen=-1;fbUntil=0;banUntil=0;
 try{sessionStorage.setItem('qs',JSON.stringify({pin,id:me}))}catch(e){}
 es=new EventSource('/api/events?pin='+pin+'&id='+me);
 es.onmessage=e=>{
  S=JSON.parse(e.data);t0=Date.now()-(S.elapsed||0);if(S.left!==undefined)tEnd=Date.now()+S.left;view='game';
  if(S.state!=='question'&&S.state!=='playing')sel=[];
  if(S.state==='final'&&!S.host)clearSess();
  if(S.mode==='kingdoms'){
   const fb=S.me&&S.me.fb;
   if(fbSeen===-2)fbSeen=fb?fb.id:-1;else if(fb&&fb.id!==fbSeen){fbSeen=fb.id;fbUntil=Date.now()+(fb.ok?1100:2200);setTimeout(render,fbUntil-Date.now()+40);sel=[]}
   if(S.banner&&S.banner.n!==bnSeen){bnSeen=S.banner.n;const ms=Math.max(0,4500-S.banner.age);banUntil=Date.now()+ms;setTimeout(render,ms+40)}
  }
  render();
 };
 es.onerror=async()=>{
  // Браузер обрывает поток и при обновлении страницы — поэтому игру «забываем» только если сервер подтвердил, что её нет.
  if(es.readyState!==2||(S&&['final','ended','kicked'].includes(S.state)))return;
  const r=await api('alive',{pin,id:me});
  if(r.alive){setTimeout(()=>{if(es&&es.readyState===2)connect()},800);return}
  if(r.error)return;
  clearSess();S=null;view='home';msg='Игра не найдена или уже завершена';render();
 };
}

   ${reg&&!INFO.hasUsers&&!closed?'<p class="auth-note mut">Первый созданный аккаунт становится администратором.</p>':''}</div><div class="auth-back-note">Безопасный вход · Ваша библиотека тестов</div></div>

async function start(){
 const qs=[];
 for(let i=0;i<quiz.q.length;i++){
  const q=quiz.q[i],a=q.a.map(x=>x.trim());while(a.length&&!a[a.length-1])a.pop();
  const cs=q.cs.filter(c=>c<a.length);
  if(!q.t.trim()||a.length<2||a.some(x=>!x)||!cs.length){msg='Вопрос '+(i+1)+': заполните текст, минимум 2 варианта и отметьте правильный';view='edit';return render()}
  qs.push({t:q.t.trim(),a,cs,T:q.T});
 }
 if(!qs.length){msg='Добавьте хотя бы один вопрос';view='edit';return render()}
 const r=await capi('create',{quiz:{title:quiz.title,T:quiz.T,mode:quiz.mode,dur:quiz.dur,need:quiz.need,q:qs}});
 if(r.error){if(view!=='auth'){msg=r.error;view='edit';render()}return}
 pin=r.pin;me=r.id;connect();
}

 const r=await api('join',{pin:p,name:n});
 if(r.error){msg=r.error;return render()}
 pin=p;me=r.id;prePin='';msg='';
 try{history.replaceState(null,'',location.pathname)}catch(e){}
 connect();
}

 try{const j=JSON.parse(await f.text()),items=Array.isArray(j)?j:j.items;const r=await capi('lib/import',{items});if(r.error)libMsg=r.error;else libInfo='Импортировано тестов: '+r.imported}catch(e){libMsg='Не удалось прочитать файл — нужен JSON, сохранённый кнопкой «Экспорт»'}
 await openLib();
}

 const search=($('lib-search')?.value ?? libSearch).trim().toLocaleLowerCase('ru-RU');libSearch=search;
 let visibleCount=0;
 document.querySelectorAll('.quiz-card').forEach(el=>{
  const source=el.dataset.source||'personal';

 if(S.state==='lobby')return a.innerHTML=`<div class="c"><div class="row justify-center gap-10"><div><b>📱 Наведите камеру телефона</b>${qrBox(230)}<span class="mut">PIN подставится сам, останется ввести имя<br>🔍 Нажмите на QR-код — он откроется на весь экран</span></div>
 <div><p class="mut">или откройте в браузере:</p><div class="big" style="word-break:break-all">${esc(joinUrl())}</div><p class="mut">и введите PIN:</p><div class="pin">${S.pin}</div></div></div><h2>${esc(S.title)}</h2><p class="mut">Режим: ${mode}</p>
 <div class="chips">${S.rows.map(p=>`<span class="chip">${esc(p.name)}<span style="cursor:pointer;margin-left:8px;opacity:.8" title="Исключить" onclick="kick('${p.id}')">✕</span></span>`).join('')||'<span class="mut">Ждём студентов…</span>'}</div><p class="big">${N} / 100 студентов</p>
 <button ${N?'':'disabled'} onclick="act('start')">Начать</button></div>`;
 if(S.state==='question')return a.innerHTML=`<div class="row justify-between"><span class="mut">Вопрос ${S.qi+1} / ${S.total}</span><span id="tm" class="flex h-16 w-16 items-center justify-center rounded-full bg-gradient-to-br from-violet-600 to-fuchsia-600 text-3xl font-black text-white shadow-lg"></span><span class="mut">Ответили: ${S.answered} / ${N}</span></div><div class="bar"><i id="tb"></i></div>
  <h1 class="my-8 text-4xl sm:text-5xl">${esc(q.t)}</h1>${q.multi?'<p class="c mut">Несколько правильных ответов — выберите все</p>':''}<div class="grid">${q.a.map((x,j)=>`<div class="ans a${j} text-xl sm:text-2xl">${SH[j]} ${esc(x)}</div>`).join('')}</div>
  <div class="chips" style="margin-top:18px">${S.rows.map(p=>`<span class="chip" style="opacity:${p.ans?1:.35}">${p.ans?'✓ ':''}${esc(p.name)}</span>`).join('')}</div>
  <div class="c" style="margin-top:14px"><button class="sec" onclick="act('skip')">Пропустить вопрос</button></div>`;
 if(S.state==='results'){
  const mx=Math.max(1,...S.counts),last=S.qi>=S.total-1,okN=S.rows.filter(p=>p.ok).length;
  return a.innerHTML=`<h2 class="c">${esc(q.t)}</h2><div class="cnt">${S.counts.slice(0,q.a.length).map((n,j)=>`<div class="a${j}" style="height:${Math.max(16,n/mx*100)}%;${S.correct.includes(j)?'outline:4px solid var(--fg)':'opacity:.45'}">${n}<br>${SH[j]}${S.correct.includes(j)?' ✓':''}</div>`).join('')}</div>
  <p class="c ok big">Правильный ответ: ${esc(S.correct.map(k=>q.a[k]).join(' + '))}</p><p class="c mut">Верно ответили: ${okN} из ${N}</p><h2>Студенты</h2>
  <div style="max-height:320px;overflow:auto">${S.rows.map((p,i)=>`<div class="lb"><span>${i+1}. ${esc(p.name)} <span class="${p.ok?'ok':p.ans?'bad':'mut'}">${p.ok?'✓':p.ans?'✗':'—'}${p.ok?' +'+p.pts:''}</span></span><span>${p.score}</span></div>`).join('')}</div>
  <div class="row" style="justify-content:center;margin-top:14px"><button onclick="act('next')">${last?'Итоги':'Следующий вопрос'}</button>${dl}</div>`;
 }
 a.innerHTML=`<h1>🏆 Итоги</h1>${podium(S.rows)}<div class="max-h-96 overflow-auto">${S.rows.slice(3).map((p,i)=>`<div class="lb"><span>${i+4}. ${esc(p.name)}</span><span>${p.score}</span></div>`).join('')}</div><div class="row" style="justify-content:center;margin-top:14px">${dl}<button onclick="newGame()">Новая игра</button></div>`;
}
function player(a){
 const p=S.me||{name:'',score:0,rank:0};
 const head=`<div class="row justify-between"><b>${esc(p.name)}</b><b>${p.score} очков</b><button class="sec" style="padding:4px 12px" onclick="leave()">Выйти</button></div>`;
 if(S.state==='lobby')return a.innerHTML=head+`<div class="c" style="margin-top:60px"><h1>Вы в игре!</h1><p class="mut">Ваше имя на экране ведущего. Ждём начала…</p>${S.mode==='kingdoms'?'<p class="mut">Режим Color Kingdoms: команда назначится при старте</p>':''}</div>`;
 if(S.state==='question'){
  if(p.answered)return a.innerHTML=head+`<div class="c" style="margin-top:60px"><h1>Ответ принят ✓</h1><p class="mut">Ждём остальных…</p></div>`;
  const mu=S.q.multi;
  return a.innerHTML=head+`<div class="bar" style="margin-top:10px"><i id="tb"></i></div><h2 class="c">Вопрос ${S.qi+1}</h2>${mu?'<p class="c mut">Выберите все правильные ответы и нажмите «Ответить»</p>':''}<div class="grid mt-5 grid-cols-2">${[...Array(S.q.n)].map((_,j)=>`<button class="ans a${j} h-36 justify-center text-6xl${mu&&sel.includes(j)?' sel':''}${mu&&sel.length&&!sel.includes(j)?' dim':''}" onclick="${mu?'tg2('+j+')':'act(\'answer\','+j+')'}">${SH[j]}</button>`).join('')}</div>${mu?`<div class="c" style="margin-top:14px"><button ${sel.length?'':'disabled'} onclick="sendSel()">Ответить</button></div>`:''}`;
 }
 if(S.state==='results'){
  const ans=p.answered,ok=ans&&p.ok;
  return a.innerHTML=head+`<div class="c" style="margin-top:30px"><h1 class="${ok?'ok':'bad'}">${ok?'Верно! 🎉':ans?'Неверно':'Время вышло'}</h1>${ok?`<p class="big">+${p.pts}</p>`:''}<p class="mut">Вы на ${p.rank} месте</p></div>`;
 }
 a.innerHTML=head+`<div class="c" style="margin-top:30px"><h1>${p.rank===1?'🥇 Вы победили!':'Игра окончена'}</h1><p class="big">Ваше место: ${p.rank}</p><button onclick="location.reload()">На главную</button></div>`;
}
function home(a){
 const teacher=USER?`<p class="entry-description">Вы вошли как <b>${esc(USER.name)}</b>. Продолжайте работу с библиотекой или сразу создайте новую викторину.</p><div class="teacher-actions"><button class="btn-primary" onclick="openLib()">Открыть кабинет <span aria-hidden="true">→</span></button><button class="sec" onclick="newQ()">＋ Новый тест</button></div>`:`<p class="entry-description">Создавайте викторины, проводите игры в классе и анализируйте результаты учеников.</p><div class="teacher-actions"><button class="btn-primary" onclick="goAuth()">Войти в кабинет <span aria-hidden="true">→</span></button><span class="entry-footnote">Для преподавателей и ведущих</span></div>`;
 a.innerHTML=`<header class="app-topbar home-topbar"><div class="brand-lockup"><div class="brand-icon">K</div><div class="brand-copy"><strong>Квиз-арена</strong><span>Платформа игровых уроков</span></div></div><div class="topbar-tag"><span class="online-dot"></span> Онлайн-викторины</div></header>
 <section class="home-hero"><div class="hero-copy"><div class="eyebrow"><span class="eyebrow-dot"></span> ОБУЧЕНИЕ В ФОРМАТЕ ИГРЫ</div><h1 class="home-title">Уроки, которые<br><span>хочется проходить.</span></h1><p class="home-lead">Превращайте знания в командную игру. Подключайте класс по PIN-коду, отвечайте в реальном времени и радуйтесь общим победам.</p><div class="hero-benefits"><span><i>✓</i> Запуск за минуту</span><span><i>✓</i> Рейтинг в реальном времени</span></div></div>
 <div class="hero-visual" aria-hidden="true"><div class="visual-halo halo-one"></div><div class="visual-halo halo-two"></div><div class="floating-score floating-score-top"><span class="score-spark">✦</span><span><b>+320 XP</b><small>Отличная серия!</small></span></div><div class="quiz-preview"><div class="preview-top"><span class="preview-mark">K</span><span>БЫСТРЫЙ КВИЗ</span><span class="preview-step">01 / 10</span></div><div class="preview-progress"><span></span></div><h3>Готовы проверить свои знания?</h3><p>Подключайтесь и играйте вместе с классом.</p><div class="preview-options"><div class="preview-option option-violet"><span>A</span><i></i></div><div class="preview-option option-blue"><span>B</span><i></i></div><div class="preview-option option-orange"><span>C</span><i></i></div><div class="preview-option option-green"><span>D</span><i></i></div></div><div class="preview-bottom"><span class="preview-avatar-stack"><i>А</i><i>М</i><i>Д</i><i>+</i></span><span>Играйте вместе</span><span class="preview-live"><i></i> LIVE</span></div></div><div class="floating-score floating-score-bottom"><span class="trophy-icon" aria-label="Командная игра" title="Командная игра">🏆</span></div></div></section>
 <section class="entry-grid"><article class="entry-card join-card"><div class="entry-header"><div class="entry-icon join-icon">↗</div><div><span class="section-kicker">ДЛЯ УЧЕНИКОВ</span><h2>Присоединиться к игре</h2></div></div><p class="entry-description">Введите код от преподавателя — и вы в игре.</p><div class="join-fields"><label class="field-label" for="jp">PIN-код игры</label><input type="text" id="jp" placeholder="6 цифр от преподавателя" inputmode="numeric" maxlength="6" value="${esc(prePin)}" autocomplete="one-time-code" onkeydown="if(event.key==='Enter')$('jn').focus()"><label class="field-label" for="jn">Ваш никнейм</label><input type="text" id="jn" placeholder="Как к вам обращаться?" maxlength="16" value="${esc(preName)}" autocomplete="nickname" onkeydown="if(event.key==='Enter')join()"></div><p class="bad form-error" role="alert">${esc(msg)}</p><button class="btn-primary join-submit" onclick="join()">Войти в игру <span aria-hidden="true">→</span></button><div class="entry-footnote"><span class="secure-dot"></span> Регистрация не требуется</div></article>
 <article class="entry-card teacher-card"><div class="teacher-card-art"><div class="teacher-orbit orbit-a"></div><div class="teacher-orbit orbit-b"></div><div class="teacher-large-icon">✦</div><span class="teacher-mini mini-a">✓</span><span class="teacher-mini mini-b">↗</span></div><span class="section-kicker">ДЛЯ ПРЕПОДАВАТЕЛЕЙ</span><h2>Создавайте игры<br>и вдохновляйте класс.</h2>${teacher}</article></section>
 <footer class="home-footer"><span>© Квиз-арена</span><span>Меньше рутины. Больше вовлечённости.</span></footer>`;
}
function draw(){
 const a=app();
 if(view==='home')return home(a);
 if(view==='auth')return authView(a);
 if(view==='edit')return editorView();
 if(view==='lib')return lib();
 if(!S)return a.innerHTML='<p class="c mut">Подключение…</p>';
 if(S.state==='kicked'){clearSess();if(es)es.close();return a.innerHTML='<div class="c" style="margin-top:60px"><h1>Вас исключили из игры</h1><button onclick="location.reload()">На главную</button></div>'}
 if(S.state==='ended'){clearSess();if(es)es.close();return a.innerHTML='<div class="c" style="margin-top:60px"><h1>Игра завершена ведущим</h1><button onclick="location.reload()">На главную</button></div>'}
 if(S.mode==='kingdoms'&&S.state!=='lobby')S.host?hostK(a):playerK(a);else S.host?host(a):player(a);
 if(S.host&&qrFull)a.insertAdjacentHTML('beforeend',qrOverlay());
 if(S.host&&S.state!=='final')a.insertAdjacentHTML('beforeend',hostBar());
 if(S.mode==='kingdoms'&&S.banner&&Date.now()<banUntil)a.insertAdjacentHTML('beforeend',bannerHtml());
}
function tick(){
 if(!S)return;let left,tot;
 if(S.mode==='kingdoms'&&S.state==='playing'){left=Math.max(0,tEnd-Date.now());tot=S.dur;if($('tm'))$('tm').textContent=fmt(left)}
 else if(S.state==='question'){left=Math.max(0,S.T*1000-(Date.now()-t0));tot=S.T*1000;if($('tm'))$('tm').textContent=Math.ceil(left/1000)}
 else return;
 if($('tb'))$('tb').style.width=(left/tot*100)+'%';
}
function enter(){
 const k=view+'|'+(S?S.state+'|'+(S.qi||0)+'|'+(S.round||0):'');
 if(k!==lastKey){lastKey=k;const e=$('app');e.classList.remove('enter');void e.offsetWidth;e.classList.add('enter');setTimeout(()=>e.classList.remove('enter'),600)}
}
// Экран перерисовывается только если его содержимое изменилось, и не во время нажатия:
// иначе кнопка заменялась бы «из-под пальца» и ответ терялся.
function render(){
 if(down&&Date.now()-down<1500){if(!pend){pend=1;setTimeout(()=>{if(pend){pend=0;render()}},1600)}return}
 const real=$('app');vApp=document.createElement('div');
 try{draw()}finally{const h=vApp.innerHTML;vApp=null;if(h!==lastHTML){lastHTML=h;real.innerHTML=h}}
 if(view==='lib')filterLibrary();
 enter();tick();
}
if(typeof addEventListener==='function'){
 addEventListener('pointerdown',()=>{down=Date.now()},true);
 const up=()=>{down=0;if(pend){pend=0;setTimeout(render,0)}};
 addEventListener('pointerup',up,true);addEventListener('pointercancel',up,true);
}
setInterval(tick,250);
if(document.addEventListener)document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'&&view==='lib'){$('lib-search')?.focus();e.preventDefault()}if(e.key==='Escape'&&qrFull){qrFull=false;render()}});
(async()=>{
 try{INFO=await(await fetch('/api/info')).json()}catch(e){}
 try{TOKEN=localStorage.getItem('qtoken')||''}catch(e){}
 if(TOKEN){const r=await api('auth/me',{token:TOKEN});if(r.user)USER=r.user;else{TOKEN='';saveToken()}}
 const qp=new URLSearchParams(location.search).get('pin');if(qp&&/^\d{6}$/.test(qp))prePin=qp;
 const sv=getSess();if(sv&&(!prePin||sv.pin===prePin)){pin=sv.pin;me=sv.id;return connect()}
 render();if(prePin&&$('jn'))$('jn').focus();
})();

</script></body></html>
