 try{sessionStorage.setItem('qs',JSON.stringify({pin,id:me}))}catch(e){}

 es.onmessage=e=>{
  S=JSON.parse(e.data);t0=Date.now()-(S.elapsed||0);if(S.left!==undefined)tEnd=Date.now()+S.left;view='game';
  if(S.state!=='question'&&S.state!=='playing')sel=[];

  }

 };

 };

function tidyQuiz(z){
 if(!z||!Array.isArray(z.q)||!z.q.length||z.q.length>100)return null;
 const q=z.q.map(x=>{
  if(!x||typeof x.t!=='string'||!x.t.trim()||!Array.isArray(x.a)||x.a.length<2||x.a.length>4||!Array.isArray(x.cs))return null;
  const a=x.a.map(v=>String(v??'').trim().slice(0,150));while(a.length&&!a[a.length-1])a.pop();
  const cs=[...new Set(x.cs.map(Number))].filter(c=>Number.isInteger(c)&&c>=0&&c<a.length).sort((a,b)=>a-b);
  if(a.length<2||a.length>4||a.some(v=>!v)||!cs.length)return null;
  return{t:x.t.trim().slice(0,300),a,cs,T:+x.T>=5?Math.min(240,+x.T):Math.min(240,Math.max(5,+z.T||20))};
 });
 if(q.some(x=>!x))return null;
 return{title:String(z.title||'Без названия').trim().slice(0,80)||'Без названия',T:Math.min(120,Math.max(5,+z.T||20)),mode:z.mode==='kingdoms'?'kingdoms':'classic',dur:Math.min(10,Math.max(1,Math.round(+z.dur)||5)),need:Math.min(5,Math.max(1,Math.round(+z.need)||3)),q};
}
function normHead(v){return String(v??'').toLocaleLowerCase('ru-RU').replace(/ё/g,'е').replace(/[^a-zа-я0-9]+/g,' ').trim()}
function headerIndex(headers,patterns){return headers.findIndex(h=>patterns.some(p=>p.test(h)))}
function excelCorrectIndices(value,rawAnswers,answers){
 const text=String(value??'').trim();if(!text)return[];
 const tokens=text.split(/[;,|]/).map(x=>x.trim()).filter(Boolean),indexes=[];
 for(const token of tokens){
  let rawIndex=-1;
  if(/^[A-D]$/i.test(token))rawIndex=token.toUpperCase().charCodeAt(0)-65;
  else if(/^\d+$/.test(token)){const n=Number(token);rawIndex=n>=1&&n<=rawAnswers.length?n-1:(n===0?0:-1)}
  else {const found=rawAnswers.findIndex(a=>String(a??'').trim().toLocaleLowerCase('ru-RU')===token.toLocaleLowerCase('ru-RU'));rawIndex=found}
  if(rawIndex>=0&&rawIndex<rawAnswers.length){const oldText=String(rawAnswers[rawIndex]??'').trim();const newIndex=answers.indexOf(oldText);if(newIndex>=0&&!indexes.includes(newIndex))indexes.push(newIndex)}
 }
 return indexes.sort((a,b)=>a-b);
}
async function parseXlsxFile(file){
 if(typeof XLSX==='undefined')throw new Error('Библиотека Excel не загрузилась. Обновите страницу и попробуйте снова.');
 const wb=XLSX.read(await file.arrayBuffer(),{type:'array'}),tests=[],issues=[],base=file.name.replace(/\.(xlsx|xls)$/i,'').replace(/[_-]+/g,' ').trim()||'Импортированный тест';
 for(const sheetName of wb.SheetNames){
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[sheetName],{header:1,defval:'',raw:true});
  let hi=-1,headers=[],qi=-1,ans=[],ti=-1,ci=-1;
  for(let r=0;r<Math.min(rows.length,80);r++){
   const h=(rows[r]||[]).map(normHead),question=headerIndex(h,[/\bquestion\b/,/вопрос/]);
   const answers=h.map((x,i)=>({x,i})).filter(o=>/(answer|option|ответ|вариант)\s*[1-4]/.test(o.x));
   const correct=headerIndex(h,[/correct answer/,/правильн/,/верн.{0,8}ответ/,/ключ ответ/]);
   if(question>=0&&answers.length>=2&&correct>=0){hi=r;headers=h;qi=question;ans=answers.sort((a,b)=>{const na=Number((a.x.match(/[1-4]/)||[])[0]||99),nb=Number((b.x.match(/[1-4]/)||[])[0]||99);return na-nb||a.i-b.i}).map(o=>o.i);ti=headerIndex(h,[/time limit/,/^time$/, /время/,/лимит времени/]);ci=correct;break}
  }
  if(hi<0){issues.push('Лист «'+sheetName+'»: не найдены колонки «Question/Вопрос», варианты ответов и «Correct answer(s)/Правильные ответы».');continue}
  const questions=[];
  for(let ri=hi+1;ri<rows.length;ri++){
   const row=rows[ri]||[],question=String(row[qi]??'').trim();if(!question)continue;
   const rawAnswers=ans.map(ix=>String(row[ix]??'').trim());while(rawAnswers.length&&!rawAnswers[rawAnswers.length-1])rawAnswers.pop();
   const answers=rawAnswers.filter(Boolean),correct=excelCorrectIndices(row[ci],rawAnswers,answers);
   if(answers.length<2||answers.length>4||rawAnswers.some(x=>!x)||!correct.length){issues.push('Лист «'+sheetName+'», строка '+(ri+1)+': проверьте варианты ответов и правильный ответ.');continue}
   const time=Number(row[ti]);
   questions.push({t:question.slice(0,300),a:answers.slice(0,4),cs:correct,T:Number.isFinite(time)&&time>=5?Math.min(240,time):20});
   if(questions.length>=100){issues.push('Лист «'+sheetName+'»: импортированы только первые 100 вопросов.');break}
  }
  if(!questions.length){issues.push('Лист «'+sheetName+'»: нет корректных вопросов.');continue}
  const generic=/^(sheet|worksheet|лист|листья)\s*\d*$/i.test(sheetName);
  let title=wb.SheetNames.length===1||generic?base:sheetName;
  if(wb.SheetNames.length>1&&generic)title=base+' — '+sheetName;
  tests.push({title:title.slice(0,80),T:questions[0].T||20,mode:'classic',dur:5,need:3,q:questions});
 }
 if(!tests.length)throw new Error(issues.slice(0,5).join(' ')||'В Excel не найдено ни одного корректного теста.');
 return{tests,issues};
}

async function importRepoTests(inp){
 const f=inp.files&&inp.files[0];if(!f)return;
 libMsg='';libInfo='';
 try{
  let tests=[],issues=[];
  if(/\.(xlsx|xls)$/i.test(f.name)){
   const result=await parseXlsxFile(f);tests=result.tests;issues=result.issues;
  }else if(/\.json$/i.test(f.name)||f.type==='application/json'){
   const raw=JSON.parse(await f.text()),source=Array.isArray(raw)?raw:(Array.isArray(raw.items)?raw.items:null);
   if(!source||!source.length)throw new Error('В JSON не найден массив items со списком тестов.');
   if(source.length>200)throw new Error('За один импорт допускается не более 200 тестов.');
   source.forEach((entry,i)=>{const item=entry&&entry.quiz?entry.quiz:entry,z=tidyQuiz(item);if(z)tests.push(z);else issues.push('Тест №'+(i+1)+': структура или ответы некорректны.')});
  }else throw new Error('Выберите файл XLSX, XLS или JSON.');
  if(!tests.length)throw new Error('Не найдено корректных тестов. '+issues.slice(0,5).join(' '));
  const r=await capi('lib/import',{items:tests});
  if(r.error)throw new Error(r.error);
  const details='Импорт завершён: добавлено '+r.added+' тест(ов)'+(r.skipped?' (пропущено некорректных: '+r.skipped+')':'')+'.';
  await finishLibraryMutation(r,details+(issues.length?' Замечания: '+issues.slice(0,3).join(' '):''));
 }catch(e){libMsg=e.message||'Не удалось импортировать файл.';libInfo='';render()}
 inp.value='';
}

 if(!editorQuiz){view='lib';return lib()}

async function report(){
 if(typeof XLSX==='undefined')return alert('Библиотека Excel не загрузилась');
 const r=await api('report',{pin,id:me});if(r.error)return alert(r.error);
 const Q=r.questions,K=r.mode==='kingdoms',pc=(n,d)=>d?Math.round(n/d*100)+'%':'';
 const wb=XLSX.utils.book_new(),add=(n,rows)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),n);
 if(K){
  const P=[...r.players].sort((a,b)=>(b.placed||0)-(a.placed||0)||(b.correctN||0)-(a.correctN||0));
  add('Рейтинг',[['Место','Имя','Команда','Флагов','Верно','Ответов','Точность'],...P.map((p,i)=>[i+1,p.name,KN[p.team]||'',p.placed||0,p.correctN||0,p.answeredN||0,pc(p.correctN||0,p.answeredN||0)])]);
  add('По вопросам',[['№','Вопрос','Правильный ответ','Ответов','Верно','% верных'],...Q.map((q,i)=>{const L=P.flatMap(p=>p.log.filter(l=>l.qi===i)),ok=L.filter(l=>l.ok).length;return[i+1,q.t,q.cs.map(k=>q.a[k]).join(' + '),L.length,ok,pc(ok,L.length)]})]);
  if(r.teams)add('Команды',[['Команда','Трофеи','Клеток','Игроков','Флагов','Верных ответов'],...r.teams.map(t=>[KN[t.k],t.trophies,t.tiles,t.members,t.flags,t.correct])]);
 }else{
  const P=[...r.players].sort((a,b)=>b.score-a.score);
  add('Рейтинг',[['Место','Имя','Очки','Верно','Отвечено','Всего вопросов','Точность'],...P.map((p,i)=>{const ok=p.log.filter(l=>l.ok).length;return[i+1,p.name,p.score,ok,p.log.length,Q.length,pc(ok,Q.length)]})]);
  add('Ответы',[['Имя',...Q.map((q,i)=>(i+1)+'. '+q.t)],...P.map(p=>[p.name,...Q.map((q,i)=>{const l=p.log.find(x=>x.qi===i);return l?(l.ok?'✓ ':'✗ ')+l.a.map(k=>q.a[k]).join(' + '):'—'})])]);
  add('По вопросам',[['№','Вопрос','Правильный ответ','Верно','Ответили','% верных'],...Q.map((q,i)=>{const L=P.map(p=>p.log.find(x=>x.qi===i)).filter(Boolean),ok=L.filter(l=>l.ok).length;return[i+1,q.t,q.cs.map(k=>q.a[k]).join(' + '),ok,L.length,pc(ok,L.length)]})]);
 }
 XLSX.writeFile(wb,'results-'+pin+'.xlsx');
}

 a.innerHTML=head+`<div class="row mt-3 justify-center gap-1.5"><span class="mut text-sm">До флага:</span>${[...Array(need)].map((_,i)=>`<span class="inline-block h-3.5 w-3.5 rounded-full ${i<p.prog?'bg-emerald-500':'bg-slate-300 dark:bg-slate-600'}"></span>`).join('')}<span class="mut text-sm">🚩 ${p.placed}</span></div>
 <div class="card c mt-3"><h2 class="my-1 text-xl sm:text-2xl">${esc(S.q.t)}</h2>${mu?'<p class="mut text-sm">Несколько правильных ответов — выберите все и нажмите «Ответить»</p>':''}</div>
 <div class="grid mt-3">${S.q.a.map((x,j)=>`<button class="ans a${j}${mu&&sel.includes(j)?' sel':''}${mu&&sel.length&&!sel.includes(j)?' dim':''}" onclick="${mu?'tg2('+j+')':'ansK(['+j+'])'}">${SH[j]} ${esc(x)}</button>`).join('')}</div>${mu?`<div class="c" style="margin-top:14px"><button ${sel.length?'':'disabled'} onclick="ansK(sel)">Ответить</button></div>`:''}`;
}
function ansK(a){if(!a.length||!S||!S.me)return;act('answer',a,{qn:S.me.qn});sel=[]}
function hostBar(){
 const KM=S.mode==='kingdoms';
 return (S.state==='lobby'?'':`<div class="c mut" style="margin-top:20px">Можно подключиться и сейчас: ${esc(joinUrl())} · PIN ${S.pin}</div>${showQR?qrBox(260):''}`)+`<div class="row justify-center" style="margin-top:16px">${S.state==='lobby'?'':`${KM&&S.state==='playing'?'<button class="sec" onclick="finishNow()">🏁 Подвести итоги</button>':''}<button class="sec" onclick="showQR=!showQR;render()">📱 QR-код</button><button class="sec" onclick="act('lock')">${S.locked?'🔓 Открыть вход':'🔒 Закрыть вход'}</button>`}<button class="sec" onclick="endGame()">Завершить игру</button></div>`;
}
function host(a){
 const q=S.q,N=S.rows.length,KM=S.mode==='kingdoms';
 const dl='<button class="sec" onclick="report()">📊 Скачать результаты (Excel)</button>';
 const mode=KM?`Color Kingdoms — 2 команды, ${S.dur} мин., флаг за ${S.need} верн. ответ(а)`:'Classic';
 if(S.state==='lobby')return a.innerHTML=`<div class="c"><div class="row justify-center gap-10"><div><b>📱 Наведите камеру телефона</b>${qrBox(230)}<span class="mut">PIN подставится сам, останется ввести имя<br>🔍 Нажмите на QR-код — он откроется на весь экран</span></div>
 <div><p class="mut">или откройте в браузере:</p><div class="big" style="word-break:break-all">${esc(joinUrl())}</div><p class="mut">и введите PIN:</p><div class="pin">${S.pin}</div></div></div><h2>${esc(S.title)}</h2><p class="mut">Режим: ${mode}</p>
 <div class="chips">${S.rows.map(p=>`<span class="chip">${esc(p.name)}<span style="cursor:pointer;margin-left:8px;opacity:.8" title="Исключить" onclick="kick('${p.id}')">✕</span></span>`).join('')||'<span class="mut">Ждём студентов…</span>'}</div><p class="big">${N} / 100 студентов</p>
 <button ${N?'':'disabled'} onclick="act('start')">Начать</button></div>`;
 if(S.state==='question')return a.innerHTML=`<div class="row justify-between"><span class="mut">Вопрос ${S.qi+1} / ${S.total}</span><span id="tm" class="flex h-16 w-16 items-center justify-center rounded-full bg-gradient-to-br from-violet-600 to-fuchsia-600 text-3xl font-black text-white shadow-lg"></span><span class="mut">Ответили: ${S.answered} / ${N}</span></div><div class="bar"><i id="tb"></i></div>
  <h1 class="my-8 text-4xl sm:text-5xl">${esc(q.t)}</h1>${q.multi?'<p class="c mut">Несколько правильных ответов — выберите все</p>':''}<div class="grid">${q.a.map((x,j)=>`<div class="ans a${j} text-xl sm:text-2xl">${SH[j]} ${esc(x)}</div>`).join('')}</div>
  <div class="chips" style="margin-top:18px">${S.rows.map(p=>`<span class="chip" style="opacity:${p.ans?1:.35}">${p.ans?'✓ ':''}${esc(p.name)}</span>`).join('')}</div>
  <div class="c" style="margin-top:14px"><button class="sec" onclick="act('skip')">Пропустить вопрос</button></div>`;
 if(S.state==='results'){
  const mx=Math.max(1,...S.counts),last=S.qi>=S.total-1,okN=S.rows.filter(p=>p.ok).length;
  return a.innerHTML=`<h2 class="c">${esc(q.t)}</h2><div class="cnt">${S.counts.slice(0,q.a.length).map((n,j)=>`<div class="a${j}" style="height:${Math.max(16,n/mx*100)}%;${S.correct.includes(j)?'outline:4px solid var(--fg)':'opacity:.45'}">${n}<br>${SH[j]}${S.correct.includes(j)?' ✓':''}</div>`).join('')}</div>
  <p class="c ok big">Правильный ответ: ${esc(S.correct.map(k=>q.a[k]).join(' + '))}</p><p class="c mut">Верно ответили: ${okN} из ${N}</p><h2>Студенты</h2>
  <div style="max-height:320px;overflow:auto">${S.rows.map((p,i)=>`<div class="lb"><span>${i+1}. ${esc(p.name)} <span class="${p.ok?'ok':p.ans?'bad':'mut'}">${p.ok?'✓':p.ans?'✗':'—'}${p.ok?' +'+p.pts:''}</span></span><span>${p.score}</span></div>`).join('')}</div>
  <div class="row" style="justify-content:center;margin-top:14px"><button onclick="act('next')">${last?'Итоги':'Следующий вопрос'}</button>${dl}</div>`;
 }
 a.innerHTML=`<h1>🏆 Итоги</h1>${podium(S.rows)}<div class="max-h-96 overflow-auto">${S.rows.slice(3).map((p,i)=>`<div class="lb"><span>${i+4}. ${esc(p.name)}</span><span>${p.score}</span></div>`).join('')}</div><div class="row" style="justify-content:center;margin-top:14px">${dl}<button onclick="newGame()">Новая игра</button></div>`;
}
function player(a){
 const p=S.me||{name:'',score:0,rank:0};
 const head=`<div class="row justify-between"><b>${esc(p.name)}</b><b>${p.score} очков</b><button class="sec" style="padding:4px 12px" onclick="leave()">Выйти</button></div>`;
 if(S.state==='lobby')return a.innerHTML=head+`<div class="c" style="margin-top:60px"><h1>Вы в игре!</h1><p class="mut">Ваше имя на экране ведущего. Ждём начала…</p>${S.mode==='kingdoms'?'<p class="mut">Режим Color Kingdoms: команда назначится при старте</p>':''}</div>`;
 if(S.state==='question'){
  if(p.answered)return a.innerHTML=head+`<div class="c" style="margin-top:60px"><h1>Ответ принят ✓</h1><p class="mut">Ждём остальных…</p></div>`;
  const mu=S.q.multi;
  return a.innerHTML=head+`<div class="bar" style="margin-top:10px"><i id="tb"></i></div><h2 class="c">Вопрос ${S.qi+1}</h2>${mu?'<p class="c mut">Выберите все правильные ответы и нажмите «Ответить»</p>':''}<div class="grid mt-5 grid-cols-2">${[...Array(S.q.n)].map((_,j)=>`<button class="ans a${j} h-36 justify-center text-6xl${mu&&sel.includes(j)?' sel':''}${mu&&sel.length&&!sel.includes(j)?' dim':''}" onclick="${mu?'tg2('+j+')':'act(\'answer\','+j+')'}">${SH[j]}</button>`).join('')}</div>${mu?`<div class="c" style="margin-top:14px"><button ${sel.length?'':'disabled'} onclick="sendSel()">Ответить</button></div>`:''}`;
 }
 if(S.state==='results'){
  const ans=p.answered,ok=ans&&p.ok;
  return a.innerHTML=head+`<div class="c" style="margin-top:30px"><h1 class="${ok?'ok':'bad'}">${ok?'Верно! 🎉':ans?'Неверно':'Время вышло'}</h1>${ok?`<p class="big">+${p.pts}</p>`:''}<p class="mut">Вы на ${p.rank} месте</p></div>`;
 }
 a.innerHTML=head+`<div class="c" style="margin-top:30px"><h1>${p.rank===1?'🥇 Вы победили!':'Игра окончена'}</h1><p class="big">Ваше место: ${p.rank}</p><button onclick="location.reload()">На главную</button></div>`;
}
function home(a){
 const teacher=USER?`<p class="entry-description">Вы вошли как <b>${esc(USER.name||USER.login)}</b>. В кабинете находятся встроенные тесты из репозитория.</p><div class="teacher-actions"><button class="btn-primary" onclick="openLib()">Открыть кабинет <span aria-hidden="true">→</span></button></div>`:`<p class="entry-description">Войдите, чтобы выбрать встроенный тест и запустить викторину для класса.</p><div class="teacher-actions"><button class="btn-primary" onclick="goAuth()">Войти в кабинет <span aria-hidden="true">→</span></button><span class="entry-footnote">Для преподавателей</span></div>`;
 a.innerHTML=`<header class="app-topbar home-topbar"><div class="brand-lockup"><div class="brand-icon">K</div><div class="brand-copy"><strong>Квиз-арена</strong><span>Платформа игровых уроков</span></div></div><div class="topbar-tag"><span class="online-dot"></span> Онлайн-викторины</div></header>
 <section class="home-hero minimal-home-hero"><div class="hero-copy"><div class="eyebrow"><span class="eyebrow-dot"></span> ОБУЧЕНИЕ В ФОРМАТЕ ИГРЫ</div><h1 class="home-title">Знания, которые<br><span>объединяют.</span></h1><p class="home-lead">Запускайте интерактивные викторины, подключайте учеников по PIN-коду и наблюдайте за результатами в реальном времени.</p><div class="hero-benefits"><span><i>✓</i> Без регистрации для учеников</span><span><i>✓</i> Два режима игры</span></div></div><aside class="home-guide"><span class="section-kicker">КАК ЭТО РАБОТАЕТ</span><div class="guide-step"><span>1</span><div><b>Выберите тест</b><small>Готовые вопросы из проекта</small></div></div><div class="guide-step"><span>2</span><div><b>Запустите игру</b><small>Получите PIN-код комнаты</small></div></div><div class="guide-step"><span>3</span><div><b>Подключите класс</b><small>Ученики отвечают со своих устройств</small></div></div></aside></section>
 <section class="entry-grid minimal-entry-grid"><article class="entry-card join-card"><div class="entry-header"><div class="entry-icon join-icon">↗</div><div><span class="section-kicker">ДЛЯ УЧЕНИКОВ</span><h2>Присоединиться к игре</h2></div></div><p class="entry-description">Введите код, который показал преподаватель.</p><div class="join-fields"><label class="field-label" for="jp">PIN-код</label><input type="text" id="jp" placeholder="6 цифр" inputmode="numeric" maxlength="6" value="${esc(prePin)}" autocomplete="one-time-code" onkeydown="if(event.key==='Enter')$('jn').focus()"><label class="field-label" for="jn">Имя в игре</label><input type="text" id="jn" placeholder="Ваше имя" maxlength="16" value="${esc(preName)}" autocomplete="nickname" onkeydown="if(event.key==='Enter')join()"></div><p class="bad form-error" role="alert">${esc(msg)}</p><button class="btn-primary join-submit" onclick="join()">Войти в игру <span aria-hidden="true">→</span></button><div class="entry-footnote"><span class="secure-dot"></span> Аккаунт не нужен</div></article>
 <article class="entry-card teacher-card minimal-teacher-card"><span class="section-kicker">ДЛЯ ПРЕПОДАВАТЕЛЕЙ</span><h2>Встроенные тесты<br>для вашего урока.</h2>${teacher}</article></section>
 <footer class="home-footer"><a class="eyefront-link" href="https://www.instagram.com/eyefront/" target="_blank" rel="noopener noreferrer" aria-label="Instagram eyefront, открыть в новой вкладке">© eyefront</a><span>Меньше рутины. Больше вовлечённости.</span></footer>`;
}
function draw(){
 const a=app();
 if(view==='home')return home(a);
 if(view==='auth')return authView(a);
 if(view==='quiz-editor')return editorView();
 if(view==='edit'){view='lib';return lib();}
 if(view==='lib')return lib();
 if(!S)return a.innerHTML='<p class="c mut">Подключение…</p>';
 if(S.state==='kicked'){clearSess();if(es)es.close();return a.innerHTML='<div class="c" style="margin-top:60px"><h1>Вас исключили из игры</h1><button onclick="location.reload()">На главную</button></div>'}
 if(S.state==='ended'){clearSess();if(es)es.close();return a.innerHTML='<div class="c" style="margin-top:60px"><h1>Игра завершена ведущим</h1><button onclick="location.reload()">На главную</button></div>'}
 if(S.mode==='kingdoms'&&S.state!=='lobby')S.host?hostK(a):playerK(a);else S.host?host(a):player(a);
 if(S.host&&qrFull)a.insertAdjacentHTML('beforeend',qrOverlay());
 if(S.host&&S.state!=='final')a.insertAdjacentHTML('beforeend',hostBar());
 if(S.mode==='kingdoms'&&S.banner&&Date.now()<banUntil)a.insertAdjacentHTML('beforeend',bannerHtml());
}
function tick(){
 if(!S)return;let left,tot;
 if(S.mode==='kingdoms'&&S.state==='playing'){left=Math.max(0,tEnd-Date.now());tot=S.dur;if($('tm'))$('tm').textContent=fmt(left)}
 else if(S.state==='question'){left=Math.max(0,S.T*1000-(Date.now()-t0));tot=S.T*1000;if($('tm'))$('tm').textContent=Math.ceil(left/1000)}
 else return;
 if($('tb'))$('tb').style.width=(left/tot*100)+'%';
}
function enter(){
 const k=view+'|'+(S?S.state+'|'+(S.qi||0)+'|'+(S.round||0):'');
 if(k!==lastKey){lastKey=k;const e=$('app');e.classList.remove('enter');void e.offsetWidth;e.classList.add('enter');setTimeout(()=>e.classList.remove('enter'),600)}
}
// Экран перерисовывается только если его содержимое изменилось, и не во время нажатия:
// иначе кнопка заменялась бы «из-под пальца» и ответ терялся.
function render(){
 if(down&&Date.now()-down<1500){if(!pend){pend=1;setTimeout(()=>{if(pend){pend=0;render()}},1600)}return}
 const real=$('app');vApp=document.createElement('div');
 try{draw()}finally{const h=vApp.innerHTML;vApp=null;if(h!==lastHTML){lastHTML=h;real.innerHTML=h}}
 if(view==='lib')filterLibrary();
 enter();tick();
}
if(typeof addEventListener==='function'){
 addEventListener('pointerdown',()=>{down=Date.now()},true);
 const up=()=>{down=0;if(pend){pend=0;setTimeout(render,0)}};
 addEventListener('pointerup',up,true);addEventListener('pointercancel',up,true);
}
setInterval(tick,250);
if(document.addEventListener)document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'&&view==='lib'){$('lib-search')?.focus();e.preventDefault()}if(e.key==='Escape'&&qrFull){qrFull=false;render()}});
(async()=>{
 try{INFO=await(await fetch('/api/info')).json()}catch(e){}
 try{TOKEN=localStorage.getItem('qtoken')||''}catch(e){}
 if(TOKEN){const r=await api('auth/me',{token:TOKEN});if(r.user)USER=r.user;else{TOKEN='';saveToken()}}
 const qp=new URLSearchParams(location.search).get('pin');if(qp&&/^\d{6}$/.test(qp))prePin=qp;
 const sv=getSess();if(sv&&(!prePin||sv.pin===prePin)){pin=sv.pin;me=sv.id;return connect()}
 render();if(prePin&&$('jn'))$('jn').focus();
})();

</script></body></html>
