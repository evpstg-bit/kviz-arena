function connect(){
 if(es)es.close();fbSeen=-2;bnSeen=-1;fbUntil=0;banUntil=0;
 try{sessionStorage.setItem('qs',JSON.stringify({pin,id:me,role:gameRole}))}catch(e){}
 const source=new EventSource('/api/events?pin='+encodeURIComponent(pin)+'&id='+encodeURIComponent(me));
 es=source;
 source.onmessage=e=>{
  if(es!==source)return;
  sseMissingChecks=0;
  S=JSON.parse(e.data);gameRole=S.host?'host':'player';try{sessionStorage.setItem('qs',JSON.stringify({pin,id:me,role:gameRole}))}catch(_){}t0=Date.now()-(S.elapsed||0);if(S.left!==undefined)tEnd=Date.now()+S.left;
  if(S.state!=='question'&&S.state!=='playing')sel=[];
  if(S.host&&CLIENT_SETTINGS.general.autoOpenReports&&['final','ended'].includes(S.state)&&S.reportId){
   if(autoReportSeen!==S.reportId){
    const reportId=S.reportId;autoReportSeen=reportId;autoReportPending=reportId;
    openReportDetail(reportId,true).finally(()=>{if(autoReportPending===reportId)autoReportPending=''});
   }
  }else if(!['reports','report-detail','lib','quiz-editor'].includes(view)){view='game'}
  if(S.state==='final'&&!S.host)clearSess();
  if(S.mode==='kingdoms'){
   const fb=S.me&&S.me.fb;
   if(fbSeen===-2)fbSeen=fb?fb.id:-1;else if(fb&&fb.id!==fbSeen){fbSeen=fb.id;fbUntil=Date.now()+(fb.ok?1100:2200);setTimeout(render,fbUntil-Date.now()+40);sel=[]}
   if(S.banner&&S.banner.n!==bnSeen){bnSeen=S.banner.n;const ms=Math.max(0,4500-S.banner.age);banUntil=Date.now()+ms;setTimeout(render,ms+40)}
  }
  // While the final report is loading, keep the current DOM intact instead of first
  // painting the end-game screen and immediately replacing it with the report.
  if(!(autoReportPending&&view==='game'))render();
 };
 source.onerror=async()=>{
  // Ignore stale EventSource handlers after a reconnect or a deliberate navigation.
  if(es!==source||source.readyState!==2||(S&&['final','ended','kicked'].includes(S.state)))return;
  let r;
  try{r=await api('alive',{pin,id:me})}catch(e){r={error:'Нет связи с сервером'}}
  if(es!==source)return;
  if(r&&r.alive){sseMissingChecks=0;setTimeout(()=>{if(es===source&&source.readyState===2)connect()},800);return}
  if(r&&r.error){setTimeout(()=>{if(es===source&&source.readyState===2)connect()},1200);return}
  // Confirm a missing room several times. Temporary routing/restart blips should not
  // immediately throw every participant back to the home screen.
  sseMissingChecks++;
  if(sseMissingChecks<4){setTimeout(()=>{if(es===source&&source.readyState===2)connect()},700*sseMissingChecks);return}
  const lostRole=gameRole||(S?(S.host?'host':'player'):'');clearSess();pin='';me='';S=null;view='home';msg=unavailableGameMessage(lostRole);gameRole='';sseMissingChecks=0;if(es===source)es=null;render();
 };
}

   if(question>=0&&answers.length>=2&&correct>=0){hi=r;headers=h;qi=question;ans=answers.sort((a,b)=>{const na=Number((a.x.match(/[1-4]/)||[])[0]||99),nb=Number((b.x.match(/[1-4]/)||[])[0]||99);return na-nb||a.i-b.i}).map(o=>o.i);ti=headerIndex(h,[/time limit/,/^time$/, /время/,/лимит времени/]);ci=correct;break}
  }

  const questions=[];
  for(let ri=hi+1;ri<rows.length;ri++){
   const row=rows[ri]||[],question=String(row[qi]??'').trim();if(!question)continue;
   const rawAnswers=ans.map(ix=>String(row[ix]??'').trim());while(rawAnswers.length&&!rawAnswers[rawAnswers.length-1])rawAnswers.pop();

   const time=Number(row[ti]);

   if(questions.length>=100){issues.push('Лист «'+sheetName+'»: импортированы только первые 100 вопросов.');break}
  }

async function report(){
 if(typeof XLSX==='undefined')return alert('Библиотека Excel не загрузилась');
 const r=await api('report',{pin,id:me});if(r.error)return alert(r.error);
 const Q=r.questions,K=r.mode==='kingdoms',pc=(n,d)=>d?Math.round(n/d*100)+'%':'';
 const wb=XLSX.utils.book_new(),add=(n,rows)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows.map((row,i)=>i===0?row.map(v=>typeof v==='string'?tr(v):v):row)),tr(n));
 if(K){
  const P=[...r.players].sort((a,b)=>(b.placed||0)-(a.placed||0)||(b.correctN||0)-(a.correctN||0));
  add('Рейтинг',[['Место','Имя','Команда','Флагов','Верно','Ответов','Точность'],...P.map((p,i)=>[i+1,p.name,KN[p.team]||'',p.placed||0,p.correctN||0,p.answeredN||0,pc(p.correctN||0,p.answeredN||0)])]);
  add('По вопросам',[['№','Вопрос','Правильный ответ','Ответов','Верно','% верных'],...Q.map((q,i)=>{const L=P.flatMap(p=>p.log.filter(l=>l.qi===i)),ok=L.filter(l=>l.ok).length;return[i+1,q.t,q.cs.map(k=>q.a[k]).join(' + '),L.length,ok,pc(ok,L.length)]})]);
  if(r.teams)add('Команды',[['Команда','Трофеи','Клеток','Игроков','Флагов','Верных ответов'],...r.teams.map(t=>[KN[t.k],t.trophies,t.tiles,t.members,t.flags,t.correct])]);
 }else{
  const P=[...r.players].sort((a,b)=>b.score-a.score);
  add('Рейтинг',[['Место','Имя','Очки','Верно','Отвечено','Всего вопросов','Точность'],...P.map((p,i)=>{const ok=p.log.filter(l=>l.ok).length;return[i+1,p.name,p.score,ok,p.log.length,Q.length,pc(ok,Q.length)]})]);
  add('Ответы',[['Имя',...Q.map((q,i)=>(i+1)+'. '+q.t)],...P.map(p=>[p.name,...Q.map((q,i)=>{const l=p.log.find(x=>x.qi===i);return l?(l.ok?'✓ ':'✗ ')+l.a.map(k=>q.a[k]).join(' + '):'—'})])]);
  add('По вопросам',[['№','Вопрос','Правильный ответ','Верно','Ответили','% верных'],...Q.map((q,i)=>{const L=P.map(p=>p.log.find(x=>x.qi===i)).filter(Boolean),ok=L.filter(l=>l.ok).length;return[i+1,q.t,q.cs.map(k=>q.a[k]).join(' + '),ok,L.length,pc(ok,L.length)]})]);
 }
 XLSX.writeFile(wb,'results-'+pin+'.xlsx');
}

function reportTimestamp(r){
 const raw=r&&r.completedAt;
 let n=typeof raw==='string'&&!/^\d+(?:\.\d+)?$/.test(raw)?Date.parse(raw):Number(raw);
 if(!Number.isFinite(n)||n<=0)return 0;
 return n<1e12?n*1000:n;
}
function reportDateKey(ts){
 const d=new Date(ts);
 if(!Number.isFinite(d.getTime()))return 'unknown';
 return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
}
function reportDateHeading(key){
 if(key==='unknown')return tr('Дата неизвестна');
 const parts=key.split('-').map(Number),d=new Date(parts[0],parts[1]-1,parts[2]);
 const lang=currentUiLanguage()==='zh'?'zh-CN':currentUiLanguage()==='en'?'en-US':'ru-RU';
 try{return d.toLocaleDateString(lang,{weekday:'long',day:'numeric',month:'long',year:'numeric'})}catch(e){return key}
}
function filterReportItems(items){
 const query=reportSearch.trim().toLocaleLowerCase(currentUiLanguage()==='ru'?'ru-RU':currentUiLanguage()==='zh'?'zh-CN':'en-US');
 let from=null,to=null;
 if(reportPeriod==='today'||reportPeriod==='7d'||reportPeriod==='30d'){
  from=new Date();from.setHours(0,0,0,0);
  if(reportPeriod==='7d')from.setDate(from.getDate()-6);
  if(reportPeriod==='30d')from.setDate(from.getDate()-29);
  to=new Date();to.setHours(23,59,59,999);
 }else if(reportPeriod==='custom'){
  if(reportFrom){const d=new Date(reportFrom+'T00:00:00');if(Number.isFinite(d.getTime()))from=d}
  if(reportTo){const d=new Date(reportTo+'T23:59:59.999');if(Number.isFinite(d.getTime()))to=d}
 }
 return items.filter(r=>{
  const ts=reportTimestamp(r);
  if(from&&(!ts||ts<from.getTime()))return false;
  if(to&&(!ts||ts>to.getTime()))return false;
  if(reportMode!=='all'&&String(r.mode||'classic')!==reportMode)return false;
  if(reportStatus==='complete'&&r.incomplete)return false;
  if(reportStatus==='early'&&!r.incomplete)return false;
  if(query){
   const hay=[r.title,r.modeName,r.mode].map(x=>String(x||'')).join(' ').toLocaleLowerCase(currentUiLanguage()==='ru'?'ru-RU':currentUiLanguage()==='zh'?'zh-CN':'en-US');
   if(!hay.includes(query))return false;
  }
  return true;
 });
}
function reportFilterCountText(visible,total){return tr('Показано:')+' '+visible+' / '+total}
function reportResultsMarkup(){
 const items=filterReportItems(REPORT_LIST||[]);
 if(!items.length)return `<div class="reports-empty reports-filter-empty"><div class="reports-empty-icon">⌕</div><h2>${tr('Ничего не найдено')}</h2><p>${tr('Измените фильтры или поисковый запрос.')}</p><button class="sec" onclick="resetReportFilters()">${tr('Сбросить фильтры')}</button></div>`;
 const groups=new Map();
 items.forEach(r=>{const key=reportDateKey(reportTimestamp(r));if(!groups.has(key))groups.set(key,[]);groups.get(key).push(r)});
 const entries=[...groups.entries()].sort((a,b)=>{
  if(a[0]==='unknown')return 1;if(b[0]==='unknown')return -1;
  const cmp=a[0].localeCompare(b[0]);
  return reportSort==='date-asc'?cmp:-cmp;
 });
 return entries.map(([key,rows])=>{
  rows.sort((a,b)=>{
   let cmp=0;
   if(reportSort==='title-asc')cmp=String(a.title||'').localeCompare(String(b.title||''),currentUiLanguage()==='ru'?'ru-RU':currentUiLanguage()==='zh'?'zh-CN':'en-US',{sensitivity:'base'});
   else if(reportSort==='participants-desc')cmp=(Number(b.participantCount)||0)-(Number(a.participantCount)||0);
   else if(reportSort==='accuracy-desc')cmp=(Number(b.accuracy)||0)-(Number(a.accuracy)||0);
   else cmp=(reportTimestamp(a)-reportTimestamp(b))*(reportSort==='date-asc'?1:-1);
   return cmp||reportTimestamp(b)-reportTimestamp(a)||String(a.title||'').localeCompare(String(b.title||''));
  });
  return `<section class="report-date-group"><div class="report-date-group-head"><h2>${esc(reportDateHeading(key))}</h2><span class="report-count-pill">${rows.length} ${tr('отчётов')}</span></div><div class="report-session-list">${rows.map(r=>{
   const modeIcon=r.mode==='kingdoms'?'⚑':'◆';
   return `<article class="report-session-card"><div class="report-session-main"><div class="report-session-icon">${modeIcon}</div><div class="report-session-copy"><b class="report-session-title" data-user-content="true">${esc(r.title||tr('Без названия'))}</b><span>${tr(r.modeName||r.mode)} · ${reportDate(reportTimestamp(r))}${r.incomplete?' · '+tr('Завершён досрочно'):''}</span><small>${Number(r.participantCount)||0} ${tr('участников')} · ${Number(r.questionCount)||0} ${tr('вопросов')} · ${tr('Точность')}: ${Number(r.accuracy)||0}%</small></div></div><label class="report-select-control"><input type="checkbox" aria-label="${tr('Выбрать отчёт')}" ${reportSelectedIds.has(String(r.id))?'checked':''} onchange="setReportSelected('${esc(r.id)}',this.checked)"><span>${tr('Выбрать')}</span></label><button class="btn-primary btn-small" onclick="openReportDetail('${esc(r.id)}')">${tr('Открыть отчёт')} →</button></article>`;
  }).join('')}</div></section>`;
 }).join('');
}

ngth;const accuracy=q.groupAccuracy!==undefined?q.groupAccuracy:Math.round((Number(q.correctCount)||0)/(n||1)*1000)/10;const accuracyLabel=Number.isInteger(accuracy)?String(accuracy):accuracy.toFixed(1);return `<div class="report-hard-question"><div class="report-hard-question-title"><b>#${q.index}</b><span data-user-content="true">${esc(q.t)}</span><strong>${accuracyLabel}%</strong></div><div class="report-bar-track"><i class="report-bar-fill ${accuracy<40?'is-low':''}" style="width:${Math.min(100,Math.max(0,accuracy))}%"></i></div><small>${q.correctCount||0} ${tr('верно')} · ${q.incorrectCount||0} ${tr('неверно')} · ${tr('из всей группы')}: ${n}</small></div>`}).join('')||`<p class="mut">${tr('Нет вопросов с точностью ниже 40% по всей группе.')}</p>`}</section></div>`;
 const partSubTabs=[['all','Все участники'],['help','Нуждаются в помощи'],['teams','Статистика по командам']];

function exportReportXlsx(){
 if(typeof XLSX==='undefined')return alert('Библиотека Excel не загрузилась');const r=ACTIVE_REPORT;if(!r)return;
 const wb=XLSX.utils.book_new(),add=(name,rows)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),tr(name));

function tr(text){
 const lang=currentUiLanguage(); if(lang==='ru')return String(text);
 const d=UI_TRANSLATIONS[lang]||{};
 let out=String(text);
 if(Object.prototype.hasOwnProperty.call(d,out))return d[out];
 // Translate dynamic interface captions while preserving question text, player names, and counts.
 const patterns=lang==='en' ? [
  [/^Вопрос (\d+) \/ (\d+)$/,'Question $1 / $2'],[/^Вопрос (\d+)$/,'Question $1'],[/^Раунд (\d+)$/,'Round $1'],[/^Ответили: (\d+) \/ (\d+)$/,'Answered: $1 / $2'],[/^(\d+) \/ 100 участников$/,'$1 / 100 participants'],[/^(\d+) очков$/,'$1 points'],[/^Ваше место: (\d+)$/,'Your place: $1'],[/^Вы на (\d+) месте$/,'You are ranked $1'],[/^До флага:$/,'Until next flag:'],[/^Найдено: (\d+)$/,'Found: $1'],[/^Всего тестов: (\d+)$/,'Total quizzes: $1'],[/^Экспортировано тестов: (\d+)\..*$/,'Exported quizzes: $1.'],[/^Импортировано тестов: (\d+).*$/,'Imported quizzes: $1'],[/^Тест «(.+)» обновлён\.$/,'Quiz “$1” updated.'],[/^Удалить тест «(.+)» из библиотеки проекта\? Это изменение затронет весь проект\.$/,'Delete quiz “$1” from the project library? This affects the entire project.'],[/^Правильный ответ: (.+)$/,'Correct answer: $1'],[/^Верно ответили: (\d+) из (\d+)$/,'Correct answers: $1 of $2'],[/^(\d+) из 100 · Отметьте правильные ответы$/,'$1 of 100 · Mark the correct answers'],[/^(\d+) вопрос$/,'$1 question'],[/^(\d+) вопроса$/,'$1 questions'],[/^(\d+) вопросов$/,'$1 questions'],[/^Режим: Color Kingdoms — 2 команды, (\d+) мин\., флаг за (\d+) верн\. ответ\(а\)$/,'Mode: Color Kingdoms — 2 teams, $1 min, flag after $2 correct answer(s)'],[/^Color Kingdoms — 2 команды, (\d+) мин\., флаг за (\d+) верн\. ответ\(а\)$/,'Color Kingdoms — 2 teams, $1 min, flag after $2 correct answer(s)'],[/^Ваш вклад: 🚩 (\d+) флагов · ✓ (\d+) верных из (\d+)$/,'Your contribution: 🚩 $1 flags · ✓ $2 correct out of $3'],[/^Всего вопросов: (\d+)$/,'Total questions: $1']
 ] : [
  [/^Вопрос (\d+) \/ (\d+)$/,'问题 $1 / $2'],[/^Вопрос (\d+)$/,'问题 $1'],[/^Раунд (\d+)$/,'第 $1 回合'],[/^Ответили: (\d+) \/ (\d+)$/,'已作答：$1 / $2'],[/^(\d+) \/ 100 участников$/,'$1 / 100 名参与者'],[/^(\d+) очков$/,'$1 分'],[/^Ваше место: (\d+)$/,'您的排名：$1'],[/^Вы на (\d+) месте$/,'您的排名是第 $1 名'],[/^Найдено: (\d+)$/,'找到：$1'],[/^Всего тестов: (\d+)$/,'测验总数：$1'],[/^Экспортировано тестов: (\d+)\..*$/,'已导出测验：$1。'],[/^Импортировано тестов: (\d+).*$/,'已导入测验：$1'],[/^Тест «(.+)» обновлён\.$/,'测验“$1”已更新。'],[/^Удалить тест «(.+)» из библиотеки проекта\? Это изменение затронет весь проект\.$/,'要从项目题库中删除测验“$1”吗？这会影响整个项目。'],[/^Правильный ответ: (.+)$/,'正确答案：$1'],[/^Верно ответили: (\d+) из (\d+)$/,'答对人数：$1 / $2'],[/^(\d+) из 100 · Отметьте правильные ответы$/,'$1 / 100 · 勾选正确答案'],[/^(\d+) вопрос$/,'$1 个问题'],[/^(\d+) вопроса$/,'$1 个问题'],[/^(\d+) вопросов$/,'$1 个问题'],[/^Режим: Color Kingdoms — 2 команды, (\d+) мин\., флаг за (\d+) верн\. ответ\(а\)$/,'模式：彩色王国 — 两支队伍，$1 分钟，答对 $2 题可获得旗帜'],[/^Color Kingdoms — 2 команды, (\d+) мин\., флаг за (\d+) верн\. ответ\(а\)$/,'彩色王国 — 两支队伍，$1 分钟，答对 $2 题可获得旗帜'],[/^Ваш вклад: 🚩 (\d+) флагов · ✓ (\d+) верных из (\d+)$/,'您的贡献：🚩 $1 面旗帜 · ✓ $2 / $3 题答对'],[/^Всего вопросов: (\d+)$/,'问题总数：$1']
 ];
 for(const [re,val] of patterns){if(re.test(out))return out.replace(re,val)}
 // Replace complete words and phrases only. This avoids broken results such as “Allго” or “Importировать”.
 const entries=Object.entries(d).filter(([src])=>src).sort((a,b)=>b[0].length-a[0].length);
 const isWord=ch=>!!ch&&/[\p{L}\p{N}_]/u.test(ch);
 for(const [src,dst] of entries){
  let pos=0,idx;
  while((idx=out.indexOf(src,pos))!==-1){
   const before=out[idx-1],after=out[idx+src.length];
   const leftOk=!isWord(src[0])||!isWord(before),rightOk=!isWord(src[src.length-1])||!isWord(after);
   if(leftOk&&rightOk){out=out.slice(0,idx)+dst+out.slice(idx+src.length);pos=idx+dst.length}else pos=idx+src.length;
  }
 }
 return out;
}

function settingsHtml(){const lang=currentUiLanguage(),dark=document.documentElement.classList.contains('dark');const labels={ru:{themeTitle:'Тема оформления',status:dark?'Тёмная тема':'Светлая тема',title:dark?'Переключить на светлую тему':'Переключить на тёмную тему',aria:'Настройки отображения',language:'Язык интерфейса'},en:{themeTitle:'Appearance',status:dark?'Dark theme':'Light theme',title:dark?'Switch to light theme':'Switch to dark theme',aria:'Display settings',language:'Interface language'},zh:{themeTitle:'外观主题',status:dark?'深色主题':'浅色主题',title:dark?'切换到浅色主题':'切换到深色主题',aria:'显示设置',language:'界面语言'}}[lang];return `<div class="global-settings" aria-label="${labels.aria}"><section class="setting-card setting-language-card"><label class="setting-heading" for="ui-language">${labels.language}</label><select id="ui-language" aria-label="${labels.language}" onchange="setUiLanguage(this.value)"><option value="ru" ${lang==='ru'?'selected':''}>🇷🇺 Русский</option><option value="en" ${lang==='en'?'selected':''}>🇬🇧 English</option><option value="zh" ${lang==='zh'?'selected':''}>🇨🇳 中文</option></select></section><section class="setting-card setting-theme-card"><div class="setting-theme-copy"><span class="setting-heading">${labels.themeTitle}</span><span class="theme-toggle-status" id="theme-mode-status">${labels.status}</span></div><button id="theme-toggle" type="button" role="switch" aria-checked="${dark}" class="theme-toggle ${dark?'is-dark':''}" onclick="toggleTheme()" aria-label="${labels.title}" title="${labels.title}"><span class="theme-switch-track" aria-hidden="true"><span class="theme-switch-thumb"></span></span></button></section></div>`}
function applyUiLanguage(){
 const lang=currentUiLanguage();document.documentElement.lang=lang==='zh'?'zh-CN':lang==='en'?'en':'ru';
 const root=document.getElementById('app')||document.body;document.title=tr('Квиз-арена');
 const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const nodes=[];
 while(walker.nextNode())nodes.push(walker.currentNode);
 for(const n of nodes){
  if(n.parentElement?.closest('[data-user-content],.ans,.pin,script,style,textarea'))continue;
  const original=n.nodeValue;if(!original.trim())continue;
  const leading=original.match(/^\s*/)?.[0]||'',trailing=original.match(/\s*$/)?.[0]||'';
  const core=original.slice(leading.length,original.length-trailing.length);
  const next=tr(core);if(next!==core)n.nodeValue=leading+next+trailing;
 }
 root.querySelectorAll('[placeholder],[title],[aria-label],[alt]').forEach(el=>{
  if(el.closest('[data-user-content],.ans,.pin'))return;
  for(const attr of ['placeholder','title','aria-label','alt'])if(el.hasAttribute(attr))el.setAttribute(attr,tr(el.getAttribute(attr)));
 });
 const select=root.querySelector('#ui-language');if(select)select.value=lang;
}
const _nativeConfirm=window.confirm.bind(window),_nativeAlert=window.alert.bind(window);
window.confirm=(message)=>_nativeConfirm(tr(String(message)));
window.alert=(message)=>_nativeAlert(tr(String(message)));
// Экран перерисовывается только если его содержимое изменилось, и не во время нажатия:
// иначе кнопка заменялась бы «из-под пальца» и ответ терялся.
function render(){
 if(down&&Date.now()-down<1500){if(!pend){pend=1;setTimeout(()=>{if(pend){pend=0;render()}},1600)}return}
 trackSiteNavigation();
 const real=$('app');vApp=document.createElement('div');
 try{draw();if(view==='lib'&&folderDialog)vApp.insertAdjacentHTML('beforeend',folderDialogHtml());if(view==='lib'&&launchModeDialog)vApp.insertAdjacentHTML('beforeend',launchModeDialogHtml());if(!(S&&S.host&&S.state==='lobby')&&!vApp.querySelector('.cabinet-menu-wrap'))vApp.insertAdjacentHTML('afterbegin',`<div class="floating-menu-anchor">${cabinetMenu('')}</div>`)}finally{const h=vApp.innerHTML;vApp=null;if(h!==lastHTML){lastHTML=h;real.innerHTML=h}}
 if(view==='lib')filterLibrary();
 applyUiLanguage();
 enter();tick();
}
if(typeof addEventListener==='function'){
 document.addEventListener('pointerdown',e=>{if(cabinetMenuToggled&&!e.target.closest('.cabinet-menu-wrap'))closeCabinetMenu()},true);
 addEventListener('pointerdown',()=>{down=Date.now()},true);
 const up=()=>{down=0;if(pend){pend=0;setTimeout(render,0)}};
 addEventListener('pointerup',up,true);addEventListener('pointercancel',up,true);
}
setInterval(tick,250);
if(document.addEventListener)document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'&&view==='lib'){$('lib-search')?.focus();e.preventDefault()}if(e.key==='Escape'&&qrFull){qrFull=false;render()}else if(e.key==='Escape'&&launchModeDialog&&!modeLaunchPending){closeLaunchModeDialog()}});
(async()=>{
 try{INFO=await(await fetch('/api/info')).json();if(INFO.settings)CLIENT_SETTINGS=normalizeClientSettings(INFO.settings)}catch(e){}
 try{TOKEN=localStorage.getItem('qtoken')||''}catch(e){}
 if(TOKEN){const r=await api('auth/me',{token:TOKEN});if(r.user)USER=r.user;else{TOKEN='';saveToken()}}
 const qp=new URLSearchParams(location.search).get('pin');if(qp&&/^\d{6}$/.test(qp))prePin=qp;
 const sv=getSess();if(sv&&(!prePin||sv.pin===prePin)){
  const savedRole=sv.role||'';let status=null;
  try{status=await api('alive',{pin:sv.pin,id:sv.id})}catch(e){status={error:'Нет связи с сервером'}}
  if(status&&status.alive||status&&status.error){pin=String(sv.pin);me=String(sv.id);gameRole=savedRole;return connect()}
  clearSess();gameRole='';msg=unavailableGameMessage(savedRole);
 }
 render();if(prePin&&$('jn'))$('jn').focus();
})();
