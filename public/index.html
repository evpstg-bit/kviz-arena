function normHead(v){return String(v??'').toLocaleLowerCase('ru-RU').replace(/ё/g,'е').replace(/[^a-zа-я0-9]+/g,' ').trim()}
function headerIndex(headers,patterns){return headers.findIndex(h=>patterns.some(p=>p.test(h)))}
function excelCorrectIndices(value,rawAnswers,answers){
 const text=String(value??'').trim();if(!text)return[];
 const tokens=text.split(/[;,|]/).map(x=>x.trim()).filter(Boolean),indexes=[];
 for(const token of tokens){
  let rawIndex=-1;
  if(/^[A-D]$/i.test(token))rawIndex=token.toUpperCase().charCodeAt(0)-65;
  else if(/^\d+$/.test(token)){const n=Number(token);rawIndex=n>=1&&n<=rawAnswers.length?n-1:(n===0?0:-1)}
  else {const found=rawAnswers.findIndex(a=>String(a??'').trim().toLocaleLowerCase('ru-RU')===token.toLocaleLowerCase('ru-RU'));rawIndex=found}
  if(rawIndex>=0&&rawIndex<rawAnswers.length){const oldText=String(rawAnswers[rawIndex]??'').trim();const newIndex=answers.indexOf(oldText);if(newIndex>=0&&!indexes.includes(newIndex))indexes.push(newIndex)}
 }
 return indexes.sort((a,b)=>a-b);
}
async function parseXlsxFile(file){
 if(typeof XLSX==='undefined')throw new Error('Библиотека Excel не загрузилась. Обновите страницу и попробуйте снова.');
 const wb=XLSX.read(await file.arrayBuffer(),{type:'array'}),tests=[],issues=[],base=file.name.replace(/\.(xlsx|xls)$/i,'').replace(/[_-]+/g,' ').trim()||'Импортированный тест';
 for(const sheetName of wb.SheetNames){
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[sheetName],{header:1,defval:'',raw:true});
  let hi=-1,headers=[],qi=-1,ans=[],ti=-1,ci=-1;
  for(let r=0;r<Math.min(rows.length,80);r++){
   const h=(rows[r]||[]).map(normHead),question=headerIndex(h,[/\bquestion\b/,/вопрос/]);
   const answers=h.map((x,i)=>({x,i})).filter(o=>/(answer|option|ответ|вариант)\s*[1-4]/.test(o.x));
   const correct=headerIndex(h,[/correct answer/,/правильн/,/верн.{0,8}ответ/,/ключ ответ/]);
   if(question>=0&&answers.length>=2&&correct>=0){hi=r;headers=h;qi=question;ans=answers.sort((a,b)=>{const na=Number((a.x.match(/[1-4]/)||[])[0]||99),nb=Number((b.x.match(/[1-4]/)||[])[0]||99);return na-nb||a.i-b.i}).map(o=>o.i);ti=headerIndex(h,[/time limit/,/^time$/, /время/,/лимит времени/]);ci=correct;break}
  }
  if(hi<0){issues.push('Лист «'+sheetName+'»: не найдены колонки «Question/Вопрос», варианты ответов и «Correct answer(s)/Правильные ответы».');continue}
  const questions=[];
  for(let ri=hi+1;ri<rows.length;ri++){
   const row=rows[ri]||[],question=String(row[qi]??'').trim();if(!question)continue;
   const rawAnswers=ans.map(ix=>String(row[ix]??'').trim());while(rawAnswers.length&&!rawAnswers[rawAnswers.length-1])rawAnswers.pop();
   const answers=rawAnswers.filter(Boolean),correct=excelCorrectIndices(row[ci],rawAnswers,answers);
   if(answers.length<2||answers.length>4||rawAnswers.some(x=>!x)||!correct.length){issues.push('Лист «'+sheetName+'», строка '+(ri+1)+': проверьте варианты ответов и правильный ответ.');continue}
   const time=Number(row[ti]);
   questions.push({t:question.slice(0,300),a:answers.slice(0,4),cs:correct,T:Number.isFinite(time)&&time>=5?Math.min(240,time):CLIENT_SETTINGS.general.defaultQuestionTime});
   if(questions.length>=100){issues.push('Лист «'+sheetName+'»: импортированы только первые 100 вопросов.');break}
  }
  if(!questions.length){issues.push('Лист «'+sheetName+'»: нет корректных вопросов.');continue}
  const generic=/^(sheet|worksheet|лист|листья)\s*\d*$/i.test(sheetName);
  let title=wb.SheetNames.length===1||generic?base:sheetName;
  if(wb.SheetNames.length>1&&generic)title=base+' — '+sheetName;
  tests.push({title:title.slice(0,80),T:questions[0].T||CLIENT_SETTINGS.general.defaultQuestionTime,mode:'choose',dur:5,need:3,q:questions});
 }
 if(!tests.length)throw new Error(issues.slice(0,5).join(' ')||'В Excel не найдено ни одного корректного теста.');
 return{tests,issues};
}

async function saveFolderDialog(){
 if(!folderDialog)return;const action=folderDialog.action,name=String(folderDialog.name||'').trim(),id=folderDialog.id;
 if(!name){libMsg=tr('Введите название папки');render();$('folder-dialog-name')?.focus();return}
 const op=action==='rename'?'lib/folders/update':'lib/folders/create';const r=await capi(op,{name,...(action==='rename'?{id}:{})});
 if(r.error){libMsg=r.error;libInfo='';render();$('folder-dialog-name')?.focus();return}
 folderDialog=null;selectedFolderId=r.id||id||selectedFolderId;await finishFolderMutation(r,tr(action==='rename'?'Папка переименована.':'Папка создана.'));if(action==='create'&&r.id){selectedFolderId=r.id;render()}
}
async function deleteCurrentFolder(){

}

async function moveQuizOrder(id,direction){
 if(!USER||!USER.admin||!selectedFolderId||selectedFolderId==='*'||selectedFolderId==='__root__'||libSort!=='manual'||libSearch.trim())return;
 const folderItems=(LIB||[]).filter(t=>t.folderId===selectedFolderId),ids=folderItems.map(t=>t.id),index=ids.indexOf(id),next=index+Number(direction);
 if(index<0||next<0||next>=ids.length)return;
 [ids[index],ids[next]]=[ids[next],ids[index]];
 const r=await capi('lib/reorder',{folderId:selectedFolderId,ids});
 if(r.error){libMsg=r.error;libInfo='';await refreshLibrary();render();return}
 libMsg='';libInfo=r.persistedToGitHub?tr('Порядок тестов сохранён в GitHub.'):tr('Порядок тестов изменён в библиотеке проекта. Для сохранения после нового развёртывания зафиксируйте builtin-tests.json в репозитории.');
 await refreshLibrary();render();
}

 document.querySelectorAll('.quiz-card').forEach(el=>{
  const matchesSearch=!search||(el.dataset.search||'').includes(search);
  const show=matchesSearch;el.style.display=show?'':'none';if(show)visibleCount++;
 });
 const empty=document.querySelector('.library-test-list .empty-state');if(empty)empty.style.display=search?'none':'';
 const noResults=$('library-no-results');if(noResults)noResults.hidden=!(LIB!==null&&visibleCount===0&&search);

}

async function report(){
 if(typeof XLSX==='undefined')return alert('Библиотека Excel не загрузилась');
 const r=await api('report',{pin,id:me});if(r.error)return alert(r.error);
 const Q=r.questions,K=r.mode==='kingdoms',pc=(n,d)=>d?Math.round(n/d*100)+'%':'0%';
 const wb=XLSX.utils.book_new(),add=(n,rows)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows.map((row,i)=>i===0?row.map(v=>typeof v==='string'?tr(v):v):row)),tr(n));
 add('Итоги',[['Показатель','Значение'],['Название теста',r.title],['Режим',K?'Color Kingdoms':'Classic'],['Время прохождения',formatReportDuration(r.playedSeconds)],['Количество вопросов',Q.length],['Участников',r.players.length]]);
 if(K){
  const P=[...r.players].sort((a,b)=>(b.placed||0)-(a.placed||0)||(b.correctN||0)-(a.correctN||0));
  add('Рейтинг',[['Место','Имя','Команда','Флагов','Верно','Ответов','Успешность'],...P.map((p,i)=>[i+1,p.name,KN[p.team]||'',p.placed||0,p.correctN||0,p.answeredN||0,pc(p.correctN||0,p.answeredN||0)])]);
  add('По вопросам',[['№','Вопрос','Правильный ответ','Ответов','Верно','% верных'],...Q.map((q,i)=>{const L=P.flatMap(p=>p.log.filter(l=>l.qi===i)),ok=L.filter(l=>l.ok).length;return[i+1,q.t,q.cs.map(k=>q.a[k]).join(' + '),L.length,ok,pc(ok,L.length)]})]);
  if(r.teams)add('Команды',[['Команда','Трофеи','Клеток','Игроков','Флагов','Верных ответов'],...r.teams.map(t=>[KN[t.k],t.trophies,t.tiles,t.members,t.flags,t.correct])]);
 }else{
  const P=[...r.players].sort((a,b)=>b.score-a.score);
  add('Рейтинг',[['Место','Имя','Очки','Верно','Отвечено','Всего вопросов','Успешность'],...P.map((p,i)=>{const ok=p.log.filter(l=>l.ok).length;return[i+1,p.name,p.score,ok,p.log.length,Q.length,pc(ok,Q.length)]})]);
  add('Ответы',[['Имя',...Q.map((q,i)=>(i+1)+'. '+q.t)],...P.map(p=>[p.name,...Q.map((q,i)=>{const l=p.log.find(x=>x.qi===i);return l?(l.ok?'✓ ':'✗ ')+l.a.map(k=>q.a[k]).join(' + '):'—'})])]);
  add('По вопросам',[['№','Вопрос','Правильный ответ','Верно','Ответили','Успешность'],...Q.map((q,i)=>{const L=P.map(p=>p.log.find(x=>x.qi===i)).filter(Boolean),ok=L.filter(l=>l.ok).length;return[i+1,q.t,q.cs.map(k=>q.a[k]).join(' + '),ok,L.length,pc(ok,P.length)]})]);
 }

function formatReportDuration(seconds){const total=Math.max(0,Math.floor(Number(seconds)||0)),hours=Math.floor(total/3600),minutes=Math.floor((total%3600)/60),secs=total%60,parts=[];if(hours)parts.push(hours+' '+tr('ч.'));if(minutes||hours)parts.push(minutes+' '+tr('мин.'));parts.push(secs+' '+tr('сек.'));return parts.join(' ')}
function reportDate(ts){const lang=currentUiLanguage()==='zh'?'zh-CN':currentUiLanguage()==='en'?'en-US':'ru-RU';try{return new Date(ts).toLocaleString(lang,{dateStyle:'medium',timeStyle:'short'})}catch(e){return new Date(ts).toLocaleString()}}
function reportSuccessPercent(correct,total){const n=Math.max(0,Number(total)||0),c=Math.max(0,Number(correct)||0);return n?Math.round(Math.min(c,n)/n*100):0}
function reportParticipantSuccess(p,r){const total=Math.max(0,Number(r.questionCount)||(r.questions||[]).length),correct=Number(p.correctCount)||0;if(r.mode==='classic')return reportSuccessPercent(correct,total);const answered=Math.max(0,Number(p.answeredCount)||(Array.isArray(p.log)?p.log.length:0));return reportSuccessPercent(correct,answered)}
function reportOverallSuccess(r,participants){const total=Math.max(0,Number(r.questionCount)||(r.questions||[]).length),correct=r.summary&&r.summary.totalCorrect!==undefined?Number(r.summary.totalCorrect)||0:participants.reduce((n,p)=>n+(Number(p.correctCount)||0),0);if(r.mode==='classic')return reportSuccessPercent(correct,total*participants.length);const answers=r.summary&&r.summary.totalAnswers!==undefined?Number(r.summary.totalAnswers)||0:participants.reduce((n,p)=>n+(Number(p.answeredCount)||0),0);return reportSuccessPercent(correct,answers)}

async function exportSelectedReportsXlsx(){
 const ids=[...reportSelectedIds];
 if(!ids.length)return;
 if(ids.length>100){alert(tr('Для экспорта можно выбрать не более 100 отчётов за раз.'));return}
 if(typeof XLSX==='undefined'){alert(tr('Библиотека Excel не загрузилась'));return}
 if(reportExportBusy)return;
 reportExportBusy=true;render();
 try{
  const result=await capi('reports/export',{ids});
  if(result.error){alert(tr(result.error));return}
  const reports=Array.isArray(result.reports)?result.reports:[];
  if(!reports.length){alert(tr('В экспортируемом файле нет данных.'));return}
  const wb=XLSX.utils.book_new();
  const summaryRows=[['Название отчёта','Дата','PIN','Режим','Статус','Вопросов','Участников','Время прохождения','Всего ответов','Правильные ответы','Неправильные ответы','Успешность']];
  const participantRows=[['Название отчёта','Дата','PIN','Режим','Место','Участник','Команда','Очки','Флаги','Правильные ответы','Неправильные ответы','Пропуски','Успешность','Статус']];
  const questionRows=[['Название отчёта','Дата','PIN','Режим','№','Вопрос','Правильный ответ','Ответов','Правильных','Неправильных','Успешность']];
  const optionRows=[['Название отчёта','Дата','PIN','Вопрос №','Вопрос','Вариант ответа','Выбрали раз','Правильный вариант']];
  const teamRows=[['Название отчёта','Дата','PIN','Команда','Участников','Очки','Флаги','Клетки','Правильных','Неправильных','Успешность']];
  reports.forEach(r=>{
   const ps=Array.isArray(r.participants)?r.participants:[],qs=Array.isArray(r.questions)?r.questions:[],teams=Array.isArray(r.teams)?r.teams:[];
   const date=reportDate(reportTimestamp(r)),mode=tr(r.modeName||r.mode),pinValue=String(r.pin||''),title=String(r.title||tr('Без названия')),sum=r.summary||{};
   summaryRows.push([title,date,pinValue,mode,r.incomplete?tr('Завершён досрочно'):tr('Обычное завершение'),r.questionCount??qs.length,r.participantCount??ps.length,formatReportDuration(sum.playedSeconds),sum.totalAnswers??0,sum.totalCorrect??0,sum.totalIncorrect??0,reportOverallSuccess(r,ps)+'%']);
   ps.forEach(p=>participantRows.push([title,date,pinValue,mode,p.rank??'',p.name??'',p.team??'',p.score??0,p.placed??0,p.correctCount??0,p.incorrectCount??0,p.unansweredCount===null||p.unansweredCount===undefined?'—':p.unansweredCount,reportParticipantSuccess(p,r)+'%',p.removed?tr('Вышел или исключён'):'']));
   qs.forEach(q=>{
    const rate=r.mode==='classic'?reportSuccessPercent(q.correctCount,ps.length):reportSuccessPercent(q.correctCount,q.responseCount);
    questionRows.push([title,date,pinValue,mode,q.index??'',q.t??'',Array.isArray(q.correctText)?q.correctText.join(' / '):(Array.isArray(q.correct)?q.correct.join(' / '):''),q.responseCount??0,q.correctCount??0,q.incorrectCount??0,rate+'%']);
    (Array.isArray(q.answerCounts)?q.answerCounts:[]).forEach(opt=>optionRows.push([title,date,pinValue,q.index??'',q.t??'',opt.text??'',opt.count??0,opt.correct?tr('Да'):tr('Нет')]));
   });
   teams.forEach(t=>teamRows.push([title,date,pinValue,t.name??'',t.members??0,t.points??0,t.flags??0,t.tiles??0,t.correctCount??0,t.incorrectCount??0,(t.accuracy??0)+'%']));
  });
  const add=(name,rows)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows.map((row,i)=>i===0?row.map(v=>typeof v==='string'?tr(v):v):row)),tr(name));
  add('Сводка',summaryRows);add('Участники',participantRows);add('По вопросам',questionRows);add('Варианты ответов',optionRows);if(teamRows.length>1)add('Команды',teamRows);
  XLSX.writeFile(wb,'quiz-reports-'+new Date().toISOString().slice(0,10)+'.xlsx');
  alert(tr('Экспортировано отчётов:')+' '+reports.length);
 }catch(e){
  alert(tr('Не удалось экспортировать выбранные отчёты. Проверьте соединение и повторите попытку.'));
 }finally{
  reportExportBusy=false;
  render();
 }
}

function reportTimestamp(r){
 const raw=r&&r.completedAt;
 let n=typeof raw==='string'&&!/^\d+(?:\.\d+)?$/.test(raw)?Date.parse(raw):Number(raw);
 if(!Number.isFinite(n)||n<=0)return 0;
 return n<1e12?n*1000:n;
}
function reportDateKey(ts){
 const d=new Date(ts);
 if(!Number.isFinite(d.getTime()))return 'unknown';
 return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
}
function reportDateHeading(key){
 if(key==='unknown')return tr('Дата неизвестна');
 const parts=key.split('-').map(Number),d=new Date(parts[0],parts[1]-1,parts[2]);
 const lang=currentUiLanguage()==='zh'?'zh-CN':currentUiLanguage()==='en'?'en-US':'ru-RU';
 try{return d.toLocaleDateString(lang,{weekday:'long',day:'numeric',month:'long',year:'numeric'})}catch(e){return key}
}
function filterReportItems(items){
 const query=reportSearch.trim().toLocaleLowerCase(currentUiLanguage()==='ru'?'ru-RU':currentUiLanguage()==='zh'?'zh-CN':'en-US');
 let from=null,to=null;
 if(reportPeriod==='today'||reportPeriod==='7d'||reportPeriod==='30d'){
  from=new Date();from.setHours(0,0,0,0);
  if(reportPeriod==='7d')from.setDate(from.getDate()-6);
  if(reportPeriod==='30d')from.setDate(from.getDate()-29);
  to=new Date();to.setHours(23,59,59,999);
 }else if(reportPeriod==='custom'){
  if(reportFrom){const d=new Date(reportFrom+'T00:00:00');if(Number.isFinite(d.getTime()))from=d}
  if(reportTo){const d=new Date(reportTo+'T23:59:59.999');if(Number.isFinite(d.getTime()))to=d}
 }
 return items.filter(r=>{
  const ts=reportTimestamp(r);
  if(from&&(!ts||ts<from.getTime()))return false;
  if(to&&(!ts||ts>to.getTime()))return false;
  if(reportMode!=='all'&&String(r.mode||'classic')!==reportMode)return false;
  if(reportStatus==='complete'&&r.incomplete)return false;
  if(reportStatus==='early'&&!r.incomplete)return false;
  if(query){
   const hay=[r.title,r.modeName,r.mode].map(x=>String(x||'')).join(' ').toLocaleLowerCase(currentUiLanguage()==='ru'?'ru-RU':currentUiLanguage()==='zh'?'zh-CN':'en-US');
   if(!hay.includes(query))return false;
  }
  return true;
 });
}
function reportFilterCountText(visible,total){return tr('Показано:')+' '+visible+' / '+total}
function reportResultsMarkup(){

 const groups=new Map();
 items.forEach(r=>{const key=reportDateKey(reportTimestamp(r));if(!groups.has(key))groups.set(key,[]);groups.get(key).push(r)});
 const entries=[...groups.entries()].sort((a,b)=>{
  if(a[0]==='unknown')return 1;if(b[0]==='unknown')return -1;
  const cmp=a[0].localeCompare(b[0]);
  return reportSort==='date-asc'?cmp:-cmp;
 });
 return entries.map(([key,rows])=>{
  rows.sort((a,b)=>{
   let cmp=0;
   if(reportSort==='title-asc')cmp=String(a.title||'').localeCompare(String(b.title||''),currentUiLanguage()==='ru'?'ru-RU':currentUiLanguage()==='zh'?'zh-CN':'en-US',{sensitivity:'base'});
   else if(reportSort==='participants-desc')cmp=(Number(b.participantCount)||0)-(Number(a.participantCount)||0);
   else if(reportSort==='accuracy-desc')cmp=(Number(b.accuracy)||0)-(Number(a.accuracy)||0);
   else cmp=(reportTimestamp(a)-reportTimestamp(b))*(reportSort==='date-asc'?1:-1);
   return cmp||reportTimestamp(b)-reportTimestamp(a)||String(a.title||'').localeCompare(String(b.title||''));
  });
  return `<section class="report-date-group"><div class="report-date-group-head"><h2>${esc(reportDateHeading(key))}</h2><span class="report-count-pill">${rows.length} ${tr('отчётов')}</span></div><div class="report-session-list">${rows.map(r=>{
   const modeIcon=r.mode==='kingdoms'?'⚑':'◆';
   return `<article class="report-session-card"><div class="report-session-main"><div class="report-session-icon">${modeIcon}</div><div class="report-session-copy"><b class="report-session-title" data-user-content="true">${esc(r.title||tr('Без названия'))}</b><span>${tr(r.modeName||r.mode)} · ${reportDate(reportTimestamp(r))}${r.incomplete?' · '+tr('Завершён досрочно'):''}</span><small>${Number(r.participantCount)||0} ${tr('участников')} · ${Number(r.questionCount)||0} ${tr('вопросов')} · ${tr('Успешность')}: ${Number(r.accuracy)||0}%</small></div></div><label class="report-select-control"><input type="checkbox" aria-label="${tr('Выбрать отчёт')}" ${reportSelectedIds.has(String(r.id))?'checked':''} onchange="setReportSelected('${esc(r.id)}',this.checked)"><span>${tr('Выбрать')}</span></label><button class="btn-primary btn-small" onclick="openReportDetail('${esc(r.id)}')">${tr('Открыть отчёт')} →</button></article>`;
  }).join('')}</div></section>`;
 }).join('');
}

function reportListPage(a){

function toggleReportParticipant(rank){const n=Number(rank)||0;reportParticipantDetailRank=reportParticipantDetailRank===n?0:n;render();}

function buildReportInsights(r,ps,qs,sum){
 const copy=(ru,en,zh)=>{const lang=currentUiLanguage();return lang==='en'?en:lang==='zh'?zh:ru};
 const pct=n=>Math.round(Math.max(0,Math.min(100,Number(n)||0)));
 const avg=pct(sum.averageParticipantAccuracy!==undefined?sum.averageParticipantAccuracy:sum.accuracy);
 const threshold=Math.max(0,Math.min(100,Number(r.supportThreshold!==undefined?r.supportThreshold:60)));
 const strong=ps.filter(p=>pct(p.accuracy)>=80);
 const support=ps.filter(p=>pct(p.accuracy)<threshold||p.answeredCount===0);
 const middling=ps.filter(p=>pct(p.accuracy)>=threshold&&pct(p.accuracy)<80);
 const questions=qs.map((q,i)=>Object.assign({},q,{_analysisIndex:Number(q.index)||i+1,_analysisAccuracy:pct(q.accuracy)}));
 const noResponses=questions.filter(q=>!(Number(q.responseCount)||Number(q.respondentCount)||0));
 const answeredQuestions=questions.filter(q=>Number(q.responseCount)>0||Number(q.respondentCount)>0);
 const hard=answeredQuestions.filter(q=>q._analysisAccuracy<40).sort((a,b)=>a._analysisAccuracy-b._analysisAccuracy);
 const review=answeredQuestions.filter(q=>q._analysisAccuracy>=40&&q._analysisAccuracy<60).sort((a,b)=>a._analysisAccuracy-b._analysisAccuracy);
 const easy=answeredQuestions.filter(q=>q._analysisAccuracy>=80).sort((a,b)=>b._analysisAccuracy-a._analysisAccuracy);
 const focus=hard.concat(review).slice(0,3);
 const totalSkipped=r.mode==='classic'?ps.reduce((n,p)=>n+Math.max(0,Number(p.unansweredCount)||0),0):null;
 const rates=ps.map(p=>pct(p.accuracy));
 const spread=rates.length>1?Math.max.apply(null,rates)-Math.min.apply(null,rates):0;
 const sortedRates=rates.slice().sort((a,b)=>a-b);
 const median=sortedRates.length?(sortedRates.length%2?sortedRates[(sortedRates.length-1)/2]:(sortedRates[sortedRates.length/2-1]+sortedRates[sortedRates.length/2])/2):0;
 const bands=[{key:'low',label:copy('Ниже 40%','Below 40%','低于 40%'),count:ps.filter(p=>pct(p.accuracy)<40).length},{key:'developing',label:copy('40–59%','40–59%','40–59%'),count:ps.filter(p=>pct(p.accuracy)>=40&&pct(p.accuracy)<60).length},{key:'good',label:copy('60–79%','60–79%','60–79%'),count:ps.filter(p=>pct(p.accuracy)>=60&&pct(p.accuracy)<80).length},{key:'strong',label:copy('80% и выше','80% and above','80% 及以上'),count:strong.length}];
 const distributionBar=bands.map(g=>'<i class="report-ai-segment is-'+g.key+'" style="width:'+(ps.length?g.count/ps.length*100:0)+'%" title="'+g.label+': '+g.count+'"></i>').join('');
 const distributionLegend=bands.map(g=>'<div class="report-ai-band"><span class="report-ai-band-dot is-'+g.key+'"></span><span>'+g.label+'</span><b>'+g.count+'</b><small>'+(ps.length?Math.round(g.count/ps.length*100):0)+'%</small></div>').join('');
 let level=copy('Нужен разбор','Needs review','需要复盘'),levelClass='is-warning',overview='';
 if(!ps.length){level=copy('Нет данных','No data yet','暂无数据');levelClass='is-neutral';overview=copy('В отчёте пока нет участников, поэтому оценить успешность группы невозможно.','There are no participants in this report yet, so group success cannot be assessed.','报告中暂无参与者，因此无法评估整体表现。')}
 else if(avg>=80&&!hard.length&&!review.length&&!support.length&&!noResponses.length){level=copy('Уверенный результат','Strong result','整体表现良好');levelClass='is-good';overview=copy('Группа в целом хорошо справилась с тестом. Ниже можно проверить отдельные вопросы и участников, которым всё же нужна поддержка.','The group performed well overall. Review individual questions and participants who may still need support below.','整体表现较好。仍可查看下方的个别难题，以及可能需要帮助的参与者。')}
 else if(avg>=60){level=copy('Есть темы для повторения','Topics to review','部分内容需要复习');levelClass='is-neutral';overview=copy('Результат неоднородный: обратите внимание на вопросы с низкой успешностью и участников ниже установленного порога.','Results are mixed. Focus on low-success questions and participants below the set threshold.','结果存在差异。请重点关注正确率较低的问题，以及未达到设定标准的参与者。')}
 else {level=copy('Рекомендуется повторение','Review recommended','建议复习');levelClass='is-warning';overview=copy('Средняя успешность ниже 60%. Перед следующей попыткой стоит повторить ключевые понятия и разобрать типичные ошибки.','Average success is below 60%. Review key concepts and common errors before the next attempt.','平均正确率低于 60%。建议在下一次测试前复习核心概念并分析常见错误。')}
 const recommendations=[];
 if(!ps.length)recommendations.push(copy('Проведите тест с участниками, чтобы получить данные для анализа.','Run the quiz with participants to collect data for analysis.','请组织参与者完成测验，以收集分析所需的数据。'));
 if(hard.length)recommendations.push(copy('Разберите '+hard.length+' сложных вопросов с успешностью ниже 40%: '+hard.slice(0,3).map(q=>'№'+q._analysisIndex).join(', ')+'. Проверьте формулировки и повторите соответствующий материал.','Review '+hard.length+' question(s) with success below 40% ('+hard.slice(0,3).map(q=>'#'+q._analysisIndex).join(', ')+'). Check the wording and revisit the related material.','请分析 '+hard.length+' 道正确率低于 40% 的题目（'+hard.slice(0,3).map(q=>'第'+q._analysisIndex+'题').join('、')+'），检查题目表述并复习相关内容。'));
 else if(review.length)recommendations.push(copy('Повторите материал по '+review.length+' вопросам с успешностью от 40 до 59%: '+review.slice(0,3).map(q=>'№'+q._analysisIndex).join(', ')+'.','Review the material for '+review.length+' question(s) with success between 40% and 59% ('+review.slice(0,3).map(q=>'#'+q._analysisIndex).join(', ')+').','建议复习 '+review.length+' 道正确率在 40% 至 59% 之间的题目（'+review.slice(0,3).map(q=>'第'+q._analysisIndex+'题').join('、')+'）。'));
 else if(questions.length)recommendations.push(copy('Не обнаружено вопросов с успешностью ниже 60%. Для закрепления знаний разберите ошибки отдельных участников.','No questions fell below 60% success. To reinforce learning, review individual participants’ mistakes.','未发现正确率低于 60% 的题目。可进一步分析个别参与者的错误以巩固知识。'));
 if(support.length)recommendations.push(copy(support.length+' участник(ов) ниже порога внимания '+threshold+'%: '+support.slice(0,4).map(p=>esc(String(p.name||'Без имени'))).join(', ')+(support.length>4?'…':'')+'. Посмотрите их ошибки во вкладке «Участники».',support.length+' participant(s) fall below the '+threshold+'% support threshold: '+support.slice(0,4).map(p=>esc(String(p.name||'Unnamed'))).join(', ')+(support.length>4?'…':'')+'. Review their mistakes in the Participants tab.',support.length+' 位参与者低于 '+threshold+'% 的关注标准：'+support.slice(0,4).map(p=>esc(String(p.name||'未命名'))).join('、')+(support.length>4?'…':'')+'。请在“参与者”标签页查看其错误。'));
 if(totalSkipped>0)recommendations.push(copy('Зафиксировано '+totalSkipped+' пропусков ответов. Проверьте, были ли вопросы непонятны или времени на ответ оказалось недостаточно.','There were '+totalSkipped+' unanswered question(s). Check whether questions were unclear or the response time was too short.','本次测试共有 '+totalSkipped+' 次未作答。请检查题目是否难以理解，或答题时间是否不足。'));
 if(noResponses.length)recommendations.push(r.mode==='kingdoms'?copy('В режиме Color Kingdoms ответы не зарегистрированы по вопросам: '+noResponses.slice(0,4).map(q=>'№'+q._analysisIndex).join(', ')+(noResponses.length>4?' и другим':'')+'. Возможно, эти вопросы не попали в ход матча; по ним нельзя оценить сложность в этой сессии.','In Color Kingdoms, no answers were recorded for '+noResponses.slice(0,4).map(q=>'#'+q._analysisIndex).join(', ')+(noResponses.length>4?' and others':'')+'. These questions may not have appeared during the match, so their difficulty cannot be assessed from this session.','在 Color Kingdoms 模式中，以下题目没有记录到答案：'+noResponses.slice(0,4).map(q=>'第'+q._analysisIndex+'题').join('、')+(noResponses.length>4?'等':'')+'。这些题目可能未在本场比赛中出现，因此无法据此评估其难度。'):copy('Без ответов остались вопросы: '+noResponses.slice(0,4).map(q=>'№'+q._analysisIndex).join(', ')+(noResponses.length>4?' и другие':'')+'. Проверьте, отображались ли они и хватило ли времени — отсутствие ответов само по себе не доказывает высокую сложность.','No responses were recorded for '+noResponses.slice(0,4).map(q=>'#'+q._analysisIndex).join(', ')+(noResponses.length>4?' and others':'')+'. Check whether they were displayed and whether time was sufficient; no responses alone does not prove high difficulty.','以下题目没有收到答案：'+noResponses.slice(0,4).map(q=>'第'+q._analysisIndex+'题').join('、')+(noResponses.length>4?'等':'')+'。请确认题目是否显示、时间是否充足；无人作答本身不能证明题目很难。'));
 if(ps.length>1&&spread>=35)recommendations.push(copy('Разрыв между лучшим и минимальным результатом составляет '+spread+' процентных пунктов. Возможны разные уровни подготовки — полезно предложить адресное повторение материала.','The gap between the highest and lowest participant results is '+spread+' percentage points. Consider targeted review for participants with different preparation levels.','参与者最高与最低成绩相差 '+spread+' 个百分点。参与者的准备程度可能不同，可考虑提供针对性的复习。'));
 if(avg>=80&&!hard.length&&!review.length&&!support.length)recommendations.push(copy('Результаты группы устойчивые. Можно переходить к следующей теме, сохранив вопросы с отдельными ошибками для короткого повторения.','The group’s results are strong. You can move to the next topic while briefly revisiting questions with individual errors.','整体表现良好。可以进入下一主题，并简短复习仍有个别错误的题目。'));
 const qHtml=focus.length?focus.map(q=>'<div class="report-ai-question"><div class="report-ai-question-top"><span class="report-ai-qno">№'+q._analysisIndex+'</span><span class="report-ai-qtitle" data-user-content="true">'+esc(q.t||copy('Вопрос без текста','Question text missing','题目文本缺失'))+'</span><b class="'+(q._analysisAccuracy<40?'is-warning-text':'is-neutral-text')+'">'+q._analysisAccuracy+'%</b></div><div class="report-ai-track"><i class="'+(q._analysisAccuracy<40?'is-warning':'')+'" style="width:'+q._analysisAccuracy+'%"></i></div><small>'+(q._analysisAccuracy<40?copy('Менее 40% ответили правильно — стоит разобрать вопрос','Fewer than 40% answered correctly — review this question','正确率低于 40%，建议讲解此题'):copy('Правильно ответили 40–59% — полезно повторить материал','40–59% answered correctly — a quick review may help','正确率为 40–59%，建议复习相关内容'))+'</small></div>').join(''):'<p class="report-ai-empty">'+copy('Нет вопросов с правильностью ниже 60%.','No questions had accuracy below 60%.','没有正确率低于 60% 的问题。')+'</p>';
 const supportNames=support.length?support.slice(0,4).map(p=>'<span class="report-ai-name">'+esc(p.name||copy('Без имени','Unnamed','未命名'))+' <b>'+pct(p.accuracy)+'%</b></span>').join(''):'<p class="report-ai-empty">'+copy('По выбранному порогу участников для дополнительной поддержки не выявлено.','No participants fell below the current support threshold.','按当前标准，未发现需要额外支持的参与者。')+'</p>';
 const strengthNames=strong.length?strong.slice(0,4).map(p=>esc(p.name||copy('Без имени','Unnamed','未命名'))).join(', '):copy('Пока нет участников с результатом 80% и выше.','No participants reached 80% yet.','目前暂无正确率达到 80% 的参与者。');
 const deepDiagnostics=questions.map(q=>{
  const qi=Number(q._analysisIndex)-1;
  const evidence=ps.map(p=>{
   const logs=Array.isArray(p.log)?p.log:[];
   const item=logs.find(l=>Number(l.qi)===qi);
   if(!item)return null;
   const rest=logs.filter(l=>Number(l.qi)!==qi&&Number.isInteger(Number(l.qi))&&Number(l.qi)>=0);
   const restAccuracy=rest.length?rest.reduce((n,l)=>n+(l.ok?1:0),0)/rest.length*100:pct(p.accuracy);
   return{participant:p,item,restAccuracy};
  }).filter(Boolean);
  const attempts=Array.isArray(q.attempts)?q.attempts:[];
  const wrongAttempts=attempts.filter(a=>!a.ok);
  const distractors=(Array.isArray(q.answerCounts)?q.answerCounts:[]).filter(a=>!a.correct).map(a=>{
   const oi=Number(a.index);
   const count=wrongAttempts.filter(at=>Array.isArray(at.answers)&&at.answers.some(x=>Number(x)===oi)).length;
   return{text:String(a.text||copy('вариант без текста','option without text','未命名选项')),count,share:wrongAttempts.length?count/wrongAttempts.length:0};
  }).sort((a,b)=>b.share-a.share||b.count-a.count);
  const dominantDistractor=wrongAttempts.length>=3?distractors.find(d=>d.count>=2&&d.share>=0.5)||null:null;
  let discrimination=null;
  if(r.mode==='classic'&&evidence.length>=8){
   const width=Math.max(2,Math.ceil(evidence.length*0.27));
   const ordered=evidence.slice().sort((a,b)=>a.restAccuracy-b.restAccuracy);
   const bottom=ordered.slice(0,width),top=ordered.slice(-width);
   const topRate=top.reduce((n,x)=>n+(x.item.ok?1:0),0)/top.length*100;
   const bottomRate=bottom.reduce((n,x)=>n+(x.item.ok?1:0),0)/bottom.length*100;
   discrimination=Math.round((topRate-bottomRate)*10)/10;
  }
  const responseCount=q.responseCount!==undefined&&q.responseCount!==null?Math.max(0,Number(q.responseCount)||0):evidence.length;
  const coverage=ps.length?responseCount/ps.length:0;
  const flags=[];
  let priority=0;
  if(responseCount>0&&q._analysisAccuracy<40){
   flags.push({kind:'low-success',label:copy('Мало правильных ответов','Low correct-response rate','正确回答较少'),detail:copy('Правильно ответили '+q._analysisAccuracy+'% участников, которые отвечали на вопрос.','Only '+q._analysisAccuracy+'% of respondents answered correctly.','仅有 '+q._analysisAccuracy+'% 的作答者答对。')});
   priority+=3;
  }
  if(!responseCount&&ps.length&&r.mode==='classic'){
   flags.push({kind:'no-response',label:copy('Нет ответов','No responses','没有答案'),detail:copy('Нет зарегистрированных ответов. Проверьте отображение вопроса и полноту сессии.','No answers were recorded. Check question visibility and whether the session ended early.','未记录到答案。请检查题目是否显示以及测试是否提前结束。')});
   priority+=4;
  }
  if(!r.incomplete&&r.mode==='classic'&&ps.length>=5&&responseCount>0&&coverage<0.7){
   flags.push({kind:'coverage',label:copy('Многие не ответили','Many did not answer','未作答人数较多'),detail:copy('Ответили '+responseCount+' из '+ps.length+' участников. Проверьте таймер, видимость вопроса и темп занятия.','Answered by '+responseCount+' of '+ps.length+' participants. Check the timer, visibility and lesson pace.',''+responseCount+' / '+ps.length+' 名参与者作答。请检查计时、题目显示和课堂节奏。')});
   priority+=2;

 add('Questions',[['№','Вопрос','Правильный ответ','Ответов','Правильных','Неправильных','Успешность'],...r.questions.map(q=>[q.index,q.t,q.correctText.join(' / '),q.responseCount,q.correctCount,q.incorrectCount,pc(q.correctCount,r.mode==='classic'?r.participantCount:q.responseCount)])]);

function tick(){

function enter(){

  if(view==='game'&&S&&S.mode==='classic'&&S.state==='results'){
   e.classList.remove('enter');

 }
}

function applyUiLanguage(){
 const lang=currentUiLanguage();document.documentElement.lang=lang==='zh'?'zh-CN':lang==='en'?'en':'ru';
 const root=document.getElementById('app')||document.body;document.title=tr('Квиз-арена');
 const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const nodes=[];
 while(walker.nextNode())nodes.push(walker.currentNode);
 for(const n of nodes){
  if(n.parentElement?.closest('[data-user-content],.ans,.pin,script,style,textarea'))continue;
  const original=n.nodeValue;if(!original.trim())continue;
  const leading=original.match(/^\s*/)?.[0]||'',trailing=original.match(/\s*$/)?.[0]||'';
  const core=original.slice(leading.length,original.length-trailing.length);
  const next=tr(core);if(next!==core)n.nodeValue=leading+next+trailing;
 }
 root.querySelectorAll('[placeholder],[title],[aria-label],[alt]').forEach(el=>{
  if(el.closest('[data-user-content],.ans,.pin'))return;
  for(const attr of ['placeholder','title','aria-label','alt'])if(el.hasAttribute(attr))el.setAttribute(attr,tr(el.getAttribute(attr)));
 });
 const select=root.querySelector('#ui-language');if(select)select.value=lang;
}
const _nativeConfirm=window.confirm.bind(window),_nativeAlert=window.alert.bind(window);
window.confirm=(message)=>_nativeConfirm(tr(String(message)));

// Экран перерисовывается только если его содержимое изменилось, и не во время нажатия:
// иначе кнопка заменялась бы «из-под пальца» и ответ терялся.

/* Keep game nodes stable across live server updates to avoid participant-card jitter. */
let lastRenderWasGame=false;
function renderNodeKey(node){
 if(!node||node.nodeType!==1)return '';
 if(node.id)return 'id:'+node.id;
 for(const attr of ['data-player-id','data-team-id','data-tile','data-render-key']){
  const value=node.getAttribute(attr);
  if(value!==null)return attr+':'+value;
 }
 return '';
}
function sameRenderNode(a,b){
 return !!a&&!!b&&a.nodeType===b.nodeType&&(a.nodeType!==1||a.tagName===b.tagName);
}
function patchRenderNode(current,next){
 if(current.nodeType===3||current.nodeType===8){
  if(current.nodeValue!==next.nodeValue)current.nodeValue=next.nodeValue;
  return current;
 }
 if(current.nodeType!==1)return current;
 const oldAttrs=Array.from(current.attributes),newAttrs=new Map(Array.from(next.attributes).map(a=>[a.name,a.value]));
 oldAttrs.forEach(a=>{if(!newAttrs.has(a.name))current.removeAttribute(a.name)});
 newAttrs.forEach((value,name)=>{if(current.getAttribute(name)!==value)current.setAttribute(name,value)});
 patchRenderChildren(current,next);
 return current;
}
function patchRenderChildren(currentParent,nextParent){
 let cursor=currentParent.firstChild;
 const nextChildren=Array.from(nextParent.childNodes);
 for(const nextChild of nextChildren){
  const key=renderNodeKey(nextChild);
  let match=null;
  if(key){
   for(let scan=cursor;scan;scan=scan.nextSibling){if(renderNodeKey(scan)===key){match=scan;break}}
   if(match&&match!==cursor)currentParent.insertBefore(match,cursor);
   if(!match){match=nextChild.cloneNode(true);currentParent.insertBefore(match,cursor)}
  }else if(cursor&&!renderNodeKey(cursor)&&sameRenderNode(cursor,nextChild)){
   match=cursor;
  }else{
   match=nextChild.cloneNode(true);
   currentParent.insertBefore(match,cursor);
  }
  if(!sameRenderNode(match,nextChild)){
   const replacement=nextChild.cloneNode(true);
   currentParent.replaceChild(replacement,match);
   match=replacement;
  }else{
   patchRenderNode(match,nextChild);
  }
  cursor=match.nextSibling;
 }
 while(cursor){const next=cursor.nextSibling;currentParent.removeChild(cursor);cursor=next}
}
