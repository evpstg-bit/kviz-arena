<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="t d"><title id="t">Submarine Squad — экран экспедиции</title><desc id="d">Статичный экран интерфейса «Квиз-арены», демонстрационные данные.</desc><defs><linearGradient id="purple" x2="1" y2="1"><stop stop-color="#7a6bf0"/><stop offset="1" stop-color="#5548c9"/></linearGradient><linearGradient id="sea" x2="1" y2="1"><stop stop-color="#0c2038"/><stop offset="1" stop-color="#12627b"/></linearGradient></defs>
